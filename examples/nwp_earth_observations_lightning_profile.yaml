name: nwp_earth_observations_lightning
title: DGIWG NWP Earth Observations Lightning Profile
version: "1.0"
description: >
  Service profile for NWP Earth Observations Lightning data, providing
  frequency of lightning flashes per unit area via OGC API - EDR.
  Supports cube, radius, and items queries with GET and POST.
keywords:
  - cube
  - radius
  - items
  - datetime
  - frequency_of_lightning_flashes_per_unit_area
  - lightning flashes
  - lightning

# ── Profile-level constraints ─────────────────────────────────────────────
# Define what any conforming implementation MUST support.
# Validated at build time and embedded in the generated OpenAPI as
# enum/pattern constraints so runtime tools can enforce them.
allow_post_queries: true
paging:
  enabled: true
  default_limit: 10
  max_limit: 100

# Publish requirement/conformance identifiers under the DGIWG namespace.
spec_uri_base: "https://schemas.dgiwg.org/edr/1.0"

required_conformance_classes:
  - "http://www.opengis.net/spec/ogcapi-common-1/1.0/conf/core"
  - "http://www.opengis.net/spec/ogcapi-common-2/1.0/conf/collections"
  - "http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/core"
  - "http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/oas30"
  - "http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/html"
  - "http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/geojson"
  - "http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/coveragejson"
  - "http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/wkt"

extent_requirements:
  minimum_bbox: [-180, -90, 180, 90]
  extent_crs:
    allowed:
      - "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
  supported_crs:
    allowed:
      - "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      - "https://epsg.org/crs_4326/WGS-84.html"
      - "https://epsg.org/crs_25832/ETRS89-UTM-zone-32N.html"
  # RFC 3339 / ISO 8601 Gregorian TRS required
  extent_trs:
    allowed:
      - "http://www.opengis.net/def/uom/ISO-8601/0/Gregorian"

output_formats:
  - name: GeoJSON
    media_type: application/geo+json
    schema_ref: https://geojson.org/schema/FeatureCollection.json
  - name: CoverageJSON
    media_type: application/json
    schema_ref: https://schemas.opengis.net/covjson/1.0/coveragejson.json

# ── Reference metadata ────────────────────────────────────────────────────
# Describes the structure of collections a conforming service should expose.
# For dynamic fields (extent intervals, custom dimension values), use the
# full possible range — not a snapshot of current live data.
collections:
  - id: earth_observations_lightning
    title: Earth Observations Lightning Strikes
    description: >
      NWP Earth Observations Lightning data providing frequency of lightning
      flashes per unit area. Supports cube, radius, and items queries.
      Datetime values use RFC 3339 format in Zulu Gregorian time
      (e.g. 2026-04-12T21:20:50Z).
    keywords:
      - lightning
      - NWP
      - earth observations
      - DGIWG
    links:
      - href: https://example.com/collections/earth_observations_lightning
        rel: self
        title: Earth observations lightning strikes
        type: application/json
    extent:
      spatial:
        bbox:
          - [-180, -90, 180, 90]
        crs: "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      temporal:
        # Open-ended interval — use null for "up to the present" rather than
        # a specific end date, since temporal coverage grows dynamically.
        interval:
          - ["2020-01-01T00:00:00Z", null]
        values:
          - "2020-01-01T00:00:00Z/.."
        trs: "http://www.opengis.net/def/uom/ISO-8601/0/Gregorian"
    crs:
      - "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      - "https://epsg.org/crs_4326/WGS-84.html"
      - "https://epsg.org/crs_25832/ETRS89-UTM-zone-32N.html"
    output_formats:
      - GeoJSON
      - CoverageJSON
    data_queries:
      items:
        link:
          href: https://example.com/collections/earth_observations_lightning/items
          rel: data
          variables:
            query_type: items
            output_formats:
              - GeoJSON
      cube:
        link:
          href: https://example.com/collections/earth_observations_lightning/cube
          rel: data
          variables:
            query_type: cube
            output_formats:
              - CoverageJSON
      radius:
        link:
          href: https://example.com/collections/earth_observations_lightning/radius
          rel: data
          variables:
            query_type: radius
            output_formats:
              - CoverageJSON
            within_units:
              - km
              - m
    parameter_names:
      frequency_of_lightning_flashes_per_unit_area:
        type: Parameter
        description: >
          Number of occurrences of a lightning flash event per unit area per unit time.
        observedProperty:
          # CF standard name (canonical units m-2 s-1). The cfconventions.org
          # table does not deep-link to individual names, so we reference the
          # table itself (matches the approach used in the NWP Radar profile).
          id: "https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html"
          label: Frequency of Lightning Flashes per Unit Area
        unit:
          label: "Number of lightning flash events per unit area per unit time: per square metre per second."
          symbol:
            value: "m-2 s-1"
            type: "https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html"

# ── Normative requirements and abstract tests ─────────────────────────────
# Drive the AsciiDoc/PDF output. Tests must reference a valid requirement id.
requirements:
  - id: items-endpoint
    statement: The service SHALL provide a /collections/earth_observations_lightning/items endpoint.
    parts:
      - The service SHALL return GeoJSON FeatureCollection.
      - Each feature SHALL include frequency_of_lightning_flashes_per_unit_area property.
      - Each feature SHALL include datetime property in the format YYYY-MM-DDTHH:MM:SSZ e.g. 2026-04-12T21:20:50.52Z.

  - id: cube-endpoint
    statement: The service SHALL provide a /collections/earth_observations_lightning/cube endpoint.
    parts:
      - The service SHALL return CoverageJSON FeatureCollection.
      - Each feature SHALL include frequency_of_lightning_flashes_per_unit_area property.
      - Each feature SHALL include datetime property in the format YYYY-MM-DDTHH:MM:SSZ e.g. 2026-04-12T21:20:50.52Z.

  - id: radius-endpoint
    statement: The service SHALL provide a /collections/earth_observations_lightning/radius endpoint.
    parts:
      - The service SHALL return CoverageJSON FeatureCollection.
      - Each feature SHALL include frequency_of_lightning_flashes_per_unit_area property.
      - Each feature SHALL include datetime property in the format YYYY-MM-DDTHH:MM:SSZ e.g. 2026-04-12T21:20:50.52Z.

abstract_tests:
  - id: items-endpoint
    requirement_id: items-endpoint
    steps:
      - Send GET request to /collections/earth_observations_lightning/items.
      - Verify response Content-Type is application/json.
      - Verify each feature contains frequency_of_lightning_flashes_per_unit_area property.
      - Verify each feature contains datetime property.

  - id: cube-endpoint
    requirement_id: cube-endpoint
    steps:
      - Send GET request to /collections/earth_observations_lightning/cube with a valid coordinate in crs_4326 and a radius of 1km.
      - Verify response Content-Type is application/json.
      - Verify each feature contains frequency_of_lightning_flashes_per_unit_area property.
      - Verify each feature contains datetime property.
      - Verify each feature is in projection crs_4326.

  - id: radius-endpoint
    requirement_id: radius-endpoint
    steps:
      - Send GET request to /collections/earth_observations_lightning/radius with a valid coordinate in crs_4326.
      - Verify response Content-Type is application/json.
      - Verify each feature contains frequency_of_lightning_flashes_per_unit_area property.
      - Verify each feature contains datetime property.
      - Verify each feature is in projection crs_4326.
      - Verify each feature is returned within the radius area.

