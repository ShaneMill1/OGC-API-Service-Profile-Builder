    # Extra prose clauses, slotted into the canonical OGC document order.
    # All bodies are VERBATIM from the source document clauses.
    clauses:
      # Clause 5 — Conventions (verbatim from clause_5_conventions.adoc).
      - id: conventions
        title: Conventions
        position: after-terms
        obligation: normative
        body: |
          This section provides details and examples for any conventions used in the document. Examples of conventions are symbols, abbreviations, use of JSON and / or JSON schema, or special notes regarding how to read the document.

          === Identifiers

          The normative provisions in this Standard are denoted by the URI:

          `http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0`

          All requirements and conformance tests that appear in this document are denoted by partial URIs which are relative to this base.

          === Examples

          Examples provided in this specification are encoded as JSON, GeoJSON or CoverageJSON.

          === Schema representation

          JSON Schema footnote:[https://json-schema.org] objects are used throughout this standard to define the structure
          of metadata records. These schema objects are also typically represented using YAML footnote:[https://en.wikipedia.org/wiki/YAML].
          YAML is a superset of JSON, and in this standard are regarded as equivalent.

          === Use of HTTPS

          For simplicity, this document only refers to the HTTP protocol. This is not meant to exclude the use of HTTPS and simply is a shorthand notation for "HTTP or HTTPS." In fact, most servers are expected to use HTTPS, not HTTP.

      # Clause 6 — Introduction / informative text (verbatim from
      # clause_6_informative_text.adoc).
      - id: introduction
        title: Introduction
        position: before-requirements
        obligation: informative
        body: |
          RODEO, the Provision of Open Access to Public Meteorological Data and Development of Shared Federated Data Infrastructure for the Development of Information Products and Services, is a joint effort by eleven European National Meteorological and Hydrological Services (NMHS), the European Centre for Medium-Range Weather Forecasts (ECMWF) and the network of 31 European National Meteorological and Hydrological Services (EUMETNET). The Project Partners are listed in the page Partners footnote:[https://rodeo-project.eu/partners].

          The RODEO project develops a user interface and Application Programming Interfaces (API) for accessing meteorological datasets declared as High Value Datasets (HVD) by the EU Implementing Regulation (EU) 2023/138 under the EU Open Data Directive (EU) 2019/1024. The project also fosters the engagement between data providers and data users for enhancing the understanding of technical solutions being available for sharing and accessing the HVD datasets.

          Surface weather observations, climate data, weather warnings, radar data and numerical weather prediction (NWP) data are defined as meteorological high value datasets. The distribution of these datasets is going to be made available under an open licence, in machine-readable formats using APIs and bulk downloads following the FAIR principles (usability, accessibility, interoperability and reusability).

          The project is funded by the EU Digital Europe Program (DIGITAL) and EUMETNET.

          === Project Aims & Goals

          The project makes meteorological High Value Datasets easily available with an aim to bring new data to businesses, public administrations and citizens. It reinforces the European public meteorological data infrastructure and enhances the providers’ digital capacity to share data. Furthermore, the project also fosters the engagement between data providers and data users for enhancing the understanding of technical solutions to be available for sharing and accessing the datasets.

          The project strengthens the capacity of the European meteorological data providers to comply with the HVD Implementing Regulation by:

          * Developing a user interface
          * Developing APIs for accessing weather observation data, climate data, weather radar data, warnings, and Artificial Intelligence (AI) datasets
          * Developing a data catalogue for making data discoverable
          * Engaging with the data owners and user communities
          * Supporting the deployment of national data portals and APIs
          * Making HVDs available from the project partners

          === Impact on users

          The increased availability of data boosts entrepreneurship and potentially results in the creation of new companies. New open datasets are an important resource for small and medium-sized enterprises to develop new digital products and services. Reuse of data opens business opportunities for several sectors ultimately leads attracting more investors. By making data much easier to use, reseach, academia, AI applications and many other application areas can utilize the data more efficiently.

          Overall, better data availability leads to better warnings, forecasts, and services to the public and weather-critical industries, and contributes to the safe and efficient functioning of society with multiple benefits across the European economy, industry, and society.

    # Per-class lead-in prose (rendered directly under each class heading).
    class_intros: {}

    # Per-class requirements-class table rows (Dependency / Pre-conditions),
    # verbatim from the source requirements_class_*.adoc tables.
    class_metadata:
      core:
        target_type: Web API
        dependencies:
          - "OGC API - Environmental Data Retrieval Standard - Part 1: Core (2023) footnote:[https://docs.ogc.org/is/19-086r6/19-086r6.html]"
        preconditions:
          - "The API conforms to OGC API - Environmental Data Retrieval - Part 1: Core, Requirements Class: Core and Requirements Class: Collections"
      data-query-response-format:
        target_type: Web API
        dependencies:
          - "Core"
          - "CoverageJSON"
      insitu-observations:
        target_type: Web API
        dependencies:
          - "Core"
          - "Data query response format"
      nwp:
        target_type: Web API
        dependencies:
          - "Core"
          - "Data query response format"

    # Per-requirement lead-in prose + sub-headings, matching clause 7..10 of the
    # source document. Keys are requirement/recommendation ids from this config.
    requirement_headings:
      # Keys are fully class- and obligation-scoped (<class>/<seg>/<id>) because
      # the source reuses bare names across classes (e.g. collection_parameter_names
      # in core, insitu-observations and nwp) and between a requirement and a
      # recommendation in the insitu-observations class.
      core/req/openapi: OpenAPI
      core/req/collection_identifier: Collection identifier
      core/req/collection_title: Collection title
      core/req/collection_license: Collection license
      core/req/collection_spatial_extent: Collection spatial extent
      core/req/collection_temporal_extent: Collection temporal extent
      core/rec/collection_vertical_extent: Collection vertical extent
      core/req/collection_parameter_names: Collection parameter names
      core/req/collection_radius_data_query: Collection radius data query
      core/req/locations_query_response_format: Locations query response format
      core/req/error_handling: Error handling
      core/rec/data_query_response_metadata: Data query response metadata
      insitu-observations/req/collection_data_queries: Collection data queries
      insitu-observations/req/collection_parameter_names: Collection parameter names
      insitu-observations/rec/collection_parameter_names: Collection parameter names
      insitu-observations/req/collection_custom_dimensions: Collection custom dimensions
      insitu-observations/req/coveragejson_parameters: CoverageJSON parameters
      nwp/req/collection_parameter_names: Collection parameter names
      nwp/req/collection_granularity: Collection granularity
      nwp/req/collection_data_queries: Collection data queries
      data-query-response-format/req/encoding: Encoding
      data-query-response-format/req/referencing: CoverageJSON referencing
    requirement_intros:
      core/req/openapi: An OpenAPI specification provides a machine-readable description of the API interface.
      core/req/collection_identifier: A collection identifier provides a mechanism to uniquely identify a given collection in an OGC API.
      core/req/collection_title: A collection title provides a human-readable short description of the given collection.
      core/req/collection_license: A license describes the usage permissions for the data in a collection.
      core/req/collection_spatial_extent: Spatial extent of a collection.
      core/req/collection_temporal_extent: Temporal extent of a collection.
      core/rec/collection_vertical_extent: Vertical extent of a collection.
      core/req/collection_parameter_names: Parameter names is an object containing parameter objects with metadata about all parameters the collection contains.
      core/req/collection_radius_data_query: Metadata about the radius data query in a collection.
      core/req/locations_query_response_format: Structure of the response document for a /locations query.
      core/req/error_handling: HTTP status codes and response documents for responding to errors.
      core/rec/data_query_response_metadata: Metadata in the response to a data query.
      insitu-observations/req/collection_data_queries: The types of data queries implemented in a collection.
      insitu-observations/req/collection_parameter_names: Parameter names is an object containing parameter objects with metadata about all parameters the collection contains.
      insitu-observations/rec/collection_parameter_names: Parameter names is an object containing parameter objects with metadata about all parameters the collection contains.
      insitu-observations/req/collection_custom_dimensions: The custom dimensions for which you can query the collection.
      insitu-observations/req/coveragejson_parameters: The metadata about parameters in CoverageJSON.
      nwp/req/collection_parameter_names: Parameter names is an object containing parameter objects with metadata about all parameters the collection contains.
      nwp/req/collection_granularity: The organization of NWP data advertised as collections and instances.
      nwp/req/collection_data_queries: The types of data queries implemented in a collection.
      data-query-response-format/req/encoding: The response format for data queries.
      data-query-response-format/req/referencing: Coordinate referencing metadata in CoverageJSON.

    # Annexes (rendered after the Abstract Test Suite in Annex A).
    annexes:
