  # ── Authored document body (Option A) ────────────────────────────────────
  # Reproduces the hand-written clauses, figure and annexes of the OGC 26-027
  # document so the generated Metanorma document is content-complete.
  # Prose is paraphrased from the source for licensing compliance.
  body:
    # Render the four conformance classes as OGC-style clauses (clause 7..10)
    # with a lead-in sentence per requirement, instead of the flat Requirements
    # list.
    render_requirement_clauses: true

    # ── Front matter / section layout (match the hand-authored OGC 26-027) ───
    # Abstract, Keywords, Security Considerations and Submitters render INSIDE
    # the Preface (I. Keywords, II. Preface, III. Security Considerations,
    # IV. Submitting Organizations), as in the source document.
    preface_front_matter: true
    # Security Considerations front-matter text (verbatim from the source).
    security_considerations: |
      No security considerations have been made for this document.
    # The source has no normative references; its referenced documents live in
    # the informative bibliography. Clause 3 renders the standard statement.
    no_normative_references: true
    # The source lists no terms/definitions; clause 4 leads with the standard
    # statement before the Directive-49 / ModSpec prose + abbreviated terms.
    no_terms: true
    # Annex A heading, matching the source (obligation caption 'Normative').
    abstract_test_suite_title: Conformance Class Abstract Test Suite (Normative)

    # Clause 2 — Conformance (verbatim from clause_2_conformance.adoc). The
    # requirements-class bullets use the source's human-readable names.
    conformance_text: |
      Conformance with this standard shall be checked using the tests specified in Annex A (normative) of this document.

      _OGC API - Environmental Data Retrieval_ (EDR) provides a family of lightweight interfaces to access Environmental Data resources. Each resource addressed by an EDR API maps to a defined query pattern.  This standard is a profile/extension of EDR.  Conformance to this standard requires demonstrated conformance to the applicable Conformance Classes of _OGC API - Environmental Data Retrieval - Part 1: Core_.

      Implementors of EDR API are required to comply with the MetOcean EDR Profile.  A MetOcean EDR Profile shall therefore be compliant with OGC API - Environmental Data Retrieval - Part 1: Core.

      This standard identifies the following Requirements Classes which define the functional requirements.

      * "Core"
      * "Observations"
      * "Numerical Weather Prediction"

      Compliant implementation of this profile requires conformance to at least the "Core" Requirements Class.

    # Abstract — verbatim from the source document front matter
    # (clause_0_front_material.adoc).
    abstract: |
      The Open Geospatial Consortium (OGC) Environmental Data Retrieval (EDR) API provides a family of lightweight interfaces to access Environmental Data resources. Each resource addressed by an EDR API maps to a defined query pattern. OGC API - EDR identifies resources, captures compliance classes, and specifies requirements which are applicable to OGC Environmental Data Retrieval API’s. The specification addresses two fundamental operations; discovery and query. Discovery operations allow the API to be interrogated to determine its capabilities and retrieve information (metadata) about this distribution of a resource. This includes the API definition of the server as well as metadata about the Environmental Data resources provided by the server. Query operations allow Environmental Data resources to be retrieved from the underlying data store based upon simple selection criteria, defined by this standard and selected by the client.

      The flexibility of EDR allows for implementation in various environmental domains and communities of practice.

      This document defines an EDR profile in support of providing access to meteorological datasets in the MetOcean community of practice.  This includes, but is not limited to, conventions and constraints on identifiers, metadata parameters and encodings/formats and their related definitions and extensions.

    # Clause 1 — Scope (verbatim from the source document, clause_1_scope.adoc)
    scope: |
      This document defines the conventions, constraints and extensions of EDR in the context of the MetOcean community of practice.

      The MetOcean EDR Profile defined herein is an extension of the International Standard _OGC API - Environmental Data Retrieval - Part 1: Core_.

      This specification defines the conformance requirements for the MetOcean EDR Profile.  Annex A defines the abstract test suite. Annex B provides normative information on schemas.  Annex C provides informative examples.

    # Clause 4 — Terms and definitions intro (verbatim from
    # clause_4_terms_and_definitions.adoc).
    terms_text: |
      This document uses the terms defined in https://portal.ogc.org/public_ogc/directives/directives.php[OGC Policy Directive 49], which is based on the ISO/IEC Directives, Part 2, Rules for the structure and drafting of International Standards. In particular, the word “SHALL” (not “must”) is the verb form used to indicate a requirement to be strictly followed to conform to this Standard and OGC documents do not use the equivalent phrases in the ISO/IEC Directives, Part 2.

      This document also uses terms defined in the OGC Standard for Modular specifications (https://portal.opengeospatial.org/files/?artifact_id=34762[OGC 08-131r3]), also known as the 'ModSpec'. The definitions of terms such as standard, specification, requirement, and conformance test are provided in the ModSpec.

      The following additional terms and definitions also apply.

