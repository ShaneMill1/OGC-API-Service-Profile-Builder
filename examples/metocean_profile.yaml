        body: |
          // Schemas to be provided.
      - id: examples
        # Annex C (Informative) — source is a heading plus an empty
        # "=== Examples" sub-heading; reproduced verbatim.
        title: Examples (Informative)
        obligation: informative
        body: |
          === Examples
      - id: appendix-d
        # Annex D — source is the heading plus the matrix table (no intro prose).
        # The source uses a plain [appendix] (informative caption), matching
        # upstream's rendering.
        title: NWP Global Deterministic parameter name matrix
        obligation: informative
        body: |
          [cols="10,10",options="header"]
          |===
          |Parameter |ECMWF short name
          |Geopotential Height |gh
          |Temperature |t
          |Wind zonal velocity (u) |u
          |Wind meridional velocity (v) |v
          |Relative Humidity |r
          |Mean Sea Level Pressure (MSLP) |msl
          |2-m Temperature |2t
          |2-m minimum temperature in the last 3 hours |mn2t3
          |2-m maximum temperature in the last 3 hours |mx2t3
          |2-m minimum temperature in the last 6 hours |mn2t6
          |2-m maximum temperature in the last 6 hours |mx2t6
          |2m dewpoint temperature |2d
          |10m u |10u
          |10m v |10v
          |10m wind gust |10fg
          |Total Precipitation |tp
