# ── Normative requirements (transcribed from OGC 26-027, grouped by class) ──
requirements:
  # ---------- Core ----------
  - id: openapi
    conformance_class: core
    statement: An API definition SHALL be described using an OpenAPI 3.1 document.
    parts:
      - The API definition SHALL be described using an OpenAPI document (version 3.1 or higher).
      - The OpenAPI document SHALL be encoded as one of the OpenAPI JSON/YAML media types.
      - The landing page SHALL link the OpenAPI document with rel=service-desc.
      - The landing page SHALL link API documentation with rel=service-doc and type text/html.
  - id: collection_identifier
    conformance_class: core
    statement: A collection identifier SHALL NOT convey structured metadata and SHOULD use the fixed value list.
    parts:
      - A collection identifier SHALL NOT be used to convey structured metadata.
      - A collection identifier SHOULD use one of insitu-observations, climate_data, radar_observations, weather_warnings, weather_forecast.
      - The identifier string MAY include a postfix to the listed values if needed.
  - id: collection_title
    conformance_class: core
    statement: A title SHALL be set for all collections and SHALL NOT exceed 50 characters.
    parts:
      - A title SHALL be set for all collections.
      - A title SHALL NOT have more than 50 characters.
      - A title SHOULD be written in English.
      - A title SHOULD place the most important information first to guard against truncation.
      - A title SHOULD describe the collection understandably for non-experts (topic/domain and geographical area).
  - id: collection_license
    conformance_class: core
    statement: A collection SHALL link to a license of its data with rel=license and type=text/html.
    parts:
      - The links property in a collection SHALL contain a link to a license of its data.
      - The license link SHALL set the rel property to license.
      - The type property SHALL be set to text/html.
      - If the data is open data, the license SHALL be CC BY 4.0 with href https://creativecommons.org/licenses/by/4.0/.
  - id: collection_spatial_extent
    conformance_class: core
    statement: The collection spatial extent and CRS list SHALL use OGC:CRS84.
    parts:
      - The value of extent.spatial.crs SHALL be OGC:CRS84.
      - The value of crs SHALL include the element OGC:CRS84.
      - If crs_details is specified for a data_queries object, it SHALL include an object whose crs value is OGC:CRS84.
      - Additional CRSs SHOULD be presented as EPSG:<code> in crs and data_queries.*.crs_details.crs.
  - id: collection_temporal_extent
    conformance_class: core
    statement: The value of extent.temporal.trs SHALL be Gregorian.
    parts:
      - The value of extent.temporal.trs SHALL be Gregorian.
  # /rec/core/collection_vertical_extent (recommendation) — upstream renders this
  # as clause 7.8, between temporal extent (7.7) and parameter names (7.9).
  - id: collection_vertical_extent
    conformance_class: core
    level: recommendation
    statement: If extent.vertical is defined, extent.vertical.vrs SHOULD use one of the recommended vertical reference system values.
    parts:
      - If extent.vertical is defined, the value of extent.vertical.vrs SHOULD be one of "Pressure level in hPa", "Geopotential height in gpm", "Geometrical altitude above mean sea level in meters", "Height above ground in meters" or "Flight level".
  - id: collection_parameter_names
    conformance_class: core
    statement: Parameter objects SHALL specify label, description and unit using the profile conventions.
    parts:
      - The keys in parameter_names and id in the parameter object SHALL NOT convey structured metadata.
      - A parameter object SHALL specify the fields label, description and unit.
      - label SHALL NOT have more than 50 characters.
      - label SHALL be written in English.
      - unit SHALL use QUDT; unit.symbol.type SHALL be https://qudt.org/vocab/unit/<unit> and unit.symbol.value the qudt symbol.
      - observedProperty SHALL use the CF-convention (observedProperty.id = https://vocab.nerc.ac.uk/standard_name/<name>) when available; otherwise use observedProperty.description.
  - id: collection_radius_data_query
    conformance_class: core
    statement: A radius data query within_units array SHALL contain m (SI unit of length).
    parts:
      - The within_units array in a variables object for a radius data query SHALL contain m.
      - within_units MAY contain more values, each defined as a unit at https://qudt.org using the unit symbol.
      - A radius query with a limit parameter SHOULD return the closest items to the radius centre.
  - id: locations_query_response_format
    conformance_class: core
    statement: A /locations response SHALL be a GeoJSON FeatureCollection with id and properties.name per feature.
    parts:
      - The /locations response SHALL be a GeoJSON document with a FeatureCollection object.
      - Each Feature SHALL have id of type string and properties.name of type string.
      - If not all collection parameters are provided, properties.parameter-name SHALL list a subset of the parameter_names keys.
      - Links with more information SHALL be included in properties.links as OGC API - Common link objects.
      - A more detailed description MAY be provided via properties.description.
      - All strings SHALL be in English.
  - id: error_handling
    conformance_class: core
    statement: Empty results SHALL return HTTP 204 and 4xx responses SHOULD comply with RFC 9457.
    parts:
      - A query for data inside the extent that results in no data SHALL return HTTP 204 with no content.
      - A query partially within the extent SHALL respond as within the extent, returning only the in-extent portion.
      - Any 4xx response SHOULD comply with RFC 9457 Problem Details for HTTP APIs.
  # /rec/core/data_query_response_metadata (recommendation)
  - id: data_query_response_metadata
    conformance_class: core
    level: recommendation
    statement: The metadata in a data query response SHOULD mirror the terms and vocabularies used in the collection metadata.
    parts:
      - The metadata in the response to a data query (e.g. crs, parameters and units) SHOULD mirror as closely as possible the terms and vocabularies used in the collection metadata.

  # ---------- Insitu observations ----------
  - id: collection_data_queries
    conformance_class: insitu-observations
    statement: An insitu-observations collection SHALL support locations, area and radius.
    parts:
      - A collection SHALL support locations, area and radius.
  - id: collection_parameter_names
    conformance_class: insitu-observations
    statement: Insitu parameters SHALL specify metocean:standard_name, metocean:level and measurementType.
    parts:
      - Each parameter SHALL specify metocean:standard_name set to a value from the standard_name custom dimension.
      - Each parameter SHALL specify metocean:level set to a value from the level custom dimension.
      - Each parameter SHALL specify measurementType.
  # /rec/insitu-observations/collection_parameter_names (recommendation) — upstream
  # renders this within the same 8.3 "Collection parameter names" subclause as the
  # requirement above, so it is placed immediately after it.
  - id: collection_parameter_names
    conformance_class: insitu-observations
    level: recommendation
    statement: Each measurementType.method in parameter_names SHOULD follow the CF-convention cell methods.
    parts:
      - Each measurementType.method object in parameter_names SHOULD follow the CF-convention cell methods and use a value from the CF cell-methods appendix.
  - id: collection_custom_dimensions
    conformance_class: insitu-observations
    statement: An insitu-observations collection SHALL define standard_name and level custom dimensions.
    parts:
      - The collection SHALL have an extent.custom object with id standard_name.
      - Custom dimension standard_name SHALL list CF standard names in values.
      - Custom dimension standard_name SHALL specify reference https://vocab.nerc.ac.uk/standard_name/.
      - The collection SHALL have an extent.custom object with id level.
      - Custom dimension level SHALL specify reference "Height of measurement above ground level in meters".
  - id: coveragejson_parameters
    conformance_class: insitu-observations
    statement: CoverageJSON parameters SHALL carry metocean:measurementType, metocean:standard_name and metocean:level.
    parts:
      - Each object in parameters in a coverage SHALL have metocean:measurementType with the same properties as measurementType.
      - Each object in parameters SHALL have metocean:standard_name.
      - Each object in parameters SHALL have metocean:level.

  # ---------- Numerical Weather Prediction ----------
  - id: collection_parameter_names
    conformance_class: nwp
    statement: NWP parameters SHALL use ECMWF short names per Annex D for id and description.
    parts:
      - WIPPS Manual Global Deterministic NWP parameters SHALL be provided using ECMWF short names per Annex D.
      - The parameter name SHALL be provided in the description property.
      - The ECMWF short name SHALL be provided in the id property.
  - id: collection_granularity
    conformance_class: nwp
    statement: An NWP collection represents a model; instances represent model runs identified by RFC3339 datestamps.
    parts:
      - A collection SHALL represent and describe a model.
      - A collection instance SHALL represent and describe a model run.
      - A collection instance identifier SHALL be represented by an RFC3339 datestamp.
      - A collection temporal instance or interval SHALL represent a timestep or timesteps of a model run.
  - id: collection_data_queries
    conformance_class: nwp
    statement: An NWP collection SHALL support position and cube; no instance means latest.
    parts:
      - A collection SHALL support position and cube queries.
      - Data queries without an instance SHALL be interpreted as the latest instance of a collection.
      - A datetime parameter between two timestamps SHALL trigger an HTTP 400 Bad Request.

  # ---------- Data query response format ----------
  - id: encoding
    conformance_class: data-query-response-format
    statement: All data queries SHALL support CoverageJSON as a response format.
    parts:
      - All data queries SHALL support CoverageJSON as a response format.
  - id: referencing
    conformance_class: data-query-response-format
    statement: CoverageJSON domain.referencing system id SHALL reflect the crs query parameter (default OGC:CRS84).
    parts:
      - With no crs query param, domain.referencing.* system SHALL have type GeographicCRS and id OGC:CRS84.
      - With a crs query param, the system object with type GeographicCRS SHALL set id to the crs query param value.

# ── Abstract Test Suite (transcribed/derived from Annex A) ──────────────────
# ── Abstract Test Suite (verbatim from Annex A of the source document) ──────
# Each test's steps and test_purpose are copied verbatim from the upstream
# abstract_tests/*/ATS_test_*.adoc files; steps render as OGC component-form
# [.component,class=step] blocks.
abstract_tests:
  - id: openapi
    requirement_id: openapi
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile provides an API definition using an OpenAPI document
    steps:
      - Construct a path for a landing page.
      - Issue an HTTP GET request on that path.
      - Check that the value of the returned HTTP status header is 200.
      - |-
        In the `links` array in the landing page response, find the object with `rel` set to `service-desc` and `type` matching one of the following strings:

        * `application/openapi+json`
        * `application/openapi+yaml`
        * `application/vnd.oai.openapi+json`
        * `application/vnd.oai.openapi+yaml`

        Optionally, the string may be suffixed with a version number like `;version=3.1`. In that case, check that the version is >= 3.1.
      - Issue an HTTP GET request using the value of `href` for that object.
      - Check that the value of the returned HTTP status header is 200 and check that the response body is a valid OpenAPI document of version 3.1 or higher.
      - In the ``links`` array in the landing page response, find the object with `rel` set to `service-doc`.
      - Issue an HTTP GET request using the value of `href` for that object.
      - Check that the value of the returned HTTP status header is 200 and that the HTTP response header `Content-Type` contains `text/html`.
  - id: collection_identifier
    requirement_id: collection_identifier
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile API provides a valid collection identifier
    # Source renders a note (not steps); test_method_text reproduces it verbatim.
    test_method_text: This requirement is not applicable to ATS testing.
    steps:
      - This requirement is not applicable to ATS testing.
  - id: collection_title
    requirement_id: collection_title
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile provides a valid collection title
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the `collections` array, check that the `title` property is present for all array elements.
      - For each `title` value, check that the value is less than or equal to 50 characters.
  - id: collection_license
    requirement_id: collection_license
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile API provides a collection links array with a license link.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the `links` array, check that there exists one `link` object with `rel` set to `license`.
      - Issue a HTTP GET request to the url in `href` for `link` with rel `license`.
      - Check that the value of the returned HTTP status header is 200 and the HTTP response header `Content-Type` is `text/html`.
  - id: collection_spatial_extent
    requirement_id: collection_spatial_extent
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile API provides spatial extent in the correct crs.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the response document, for each object in the `collections` array, check that the `extent.spatial.crs` property is set to `OGC:CRS84`.
      - In the `collections` array, check that the `crs` property is set to `OGC:CRS84` for each object.
      - For each object in `collections` array, for each object in the `data_queries` array, if `crs_details` is specified, check that one of the objects in the `crs_details` array has a `crs` property set to `OGC:CRS84`.
  - id: collection_temporal_extent
    requirement_id: collection_temporal_extent
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile API provides temporal extent in the correct trs.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the response document, for each object in the `collections` array, check that the `extent.temporal.trs` property is set to `Gregorian`.
  - id: collection_parameter_names
    requirement_id: collection_parameter_names
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile API provides a valid collection parameter_names
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the response document, for each object in the `collections` array, check that each object in the `parameter_names` array has the properties `label`, `unit` and `description`.
      - The value of a `label` property in a `parameter` object is less than or equal to 50 characters.
      - The value of `unit.symbol.type` in a `parameter` object is a url on the form `https://qudt.org/vocab/unit/{unit}`.
      - The value of `unit.symbol.value` in a `parameter` object is specified.
  - id: collection_radius_data_query
    requirement_id: collection_radius_data_query
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile API with a radius data query in a collection has correct metadata.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the response document, for each object in the `collections` array, if the `data_queries` property contains `radius`, check that the `link.variables` object for `radius` has a `within_units` array that contains `m`.
  - id: locations_query_response_format
    requirement_id: locations_query_response_format
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile API has a correctly formated response to a locations query.
    steps:
      - 'For every collection and instance of a collection, check if `locations` exists as a key in the `data_queries` object. If so, get the `href` value from the link object with `"rel":"self"` and append `/locations` to the value and issue an HTTP GET request.'
      - Check that the value of the returned HTTP status header is 200.
      - Check that the response http header `Content-Type` has value `application/geo+json`.
      - 'In the response document, check that it has the property `"type": "FeatureCollection"`. For each object in the `features` array, check that the properties `id` and `properties.name` are present.'
  - id: error_handling
    requirement_id: error_handling
    conformance_class: core
    test_purpose: Validate that a MetOcean EDR Profile API handles errors correctly.
    steps:
      - Issue an HTTP GET request to an non-existent path `/collections/nonexistentcollection`.
      - Check that the value of the returned HTTP status code is `404` and the HTTP response header `Content-Type` is `application/problem+json`.
      - Check that the returned JSON document includes the properties `type` and `title`. Check that `title` is a string and that `type` is either an URI or the value `about:blank`.
  - id: collection_data_queries
    requirement_id: collection_data_queries
    conformance_class: insitu-observations
    test_purpose: Validate that a MetOcean EDR Insitu observations Profile API has implemented the mandatory data queries.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the `collections` array in the returned document, check that each collection has a `data_queries` array containing `area`, `locations` and `radius`.
  - id: collection_parameter_names
    requirement_id: collection_parameter_names
    conformance_class: insitu-observations
    test_purpose: Validate that a MetOcean EDR Insitu observations Profile API has the required properties for parameter_names
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - For each object in the `collections` array and for each object in `parameter_names` check that it has the properties `metocean:standard_name` with the value of type string.
      - For each object in the `collections` array and for each object in `parameter_names` check that it has the property `metocean:level` with a value of type number.
      - For each object in the `collections` array and for each object in `parameter_names` check that is has the property `measurementType`.
  - id: collection_custom_dimensions
    requirement_id: collection_custom_dimensions
    conformance_class: insitu-observations
    test_purpose: Validate that a MetOcean EDR Insitu observations Profile API has required custom dimensions.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - Check that the `extent.custom` array has an object with property `id` set to `standard_name` and property `reference` set to `https://vocab.nerc.ac.uk/standard_name/`.
      - Check that the `extent.custom` array has an object with property `id` set to `level` and property `reference` set to `Height of measurement above ground level in meters`.
  - id: coveragejson_parameters
    requirement_id: coveragejson_parameters
    conformance_class: insitu-observations
    test_purpose: Validate that a MetOcean EDR Insitu observations Profile API has required metadata in CoverageJSON parameters.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - For each object in the `collections` array and for each object in `data_queries`, issue a GET request with no crs query parameter specified.
      - Check that each object in `parameters` array of the response CoverageJSON document contains a property `metocean:standard_name` with a string type.
      - Check that each `parameter` object in `parameters` in the response CoverageJSON document contains a property `metocean:level` with a number type.
      - Check that each `parameter` object in `parameters` in the response CoverageJSON document contains a property `metocean:measurementType` which has an object type. Check that this object has the property `method` of type string and property `duration` of type string.
  - id: collection_parameter_names
    requirement_id: collection_parameter_names
    conformance_class: nwp
    test_purpose: Validate that a MetOcean EDR API has implemented the mandatory parameter names for NWP.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the `collections` array in the returned document, check that each collection has a `data_queries` array containing `position` and `cube`.
      - For each matching collection ``parameter_names`` object, check that all of the <<appendix-d>> ECMWF short names are present via each parameter name key, `id` and `description` properties.
  - id: collection_granularity
    requirement_id: collection_granularity
    conformance_class: nwp
    test_purpose: Validate that a MetOcean EDR API has implemented the mandatory granularity for NWP.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the `collections` array in the returned document, check that each collection has a `data_queries` array containing `position` and `cube`.
      - For matching collections, issue an HTTP GET request to path `/collections/{collectionId}/instances`.
      - For matching instances, ensure that the instance identifier (`id`) is an RFC3339 datestamp.
  - id: collection_data_queries
    requirement_id: collection_data_queries
    conformance_class: nwp
    test_purpose: Validate that a MetOcean EDR API has implemented the mandatory data query behaviour for NWP.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the `collections` array in the returned document, check that each collection has a `data_queries` array containing `position` and `cube`.
      - For a matching collection, issue an HTTP GET request to path `/collections/{collectionId}/position?coords=POINT(0 0)`.
      - Check that the value of the returned HTTP status header is 200.
      - For the same matching collection, issue an HTTP GET request to path `/collections/{collectionId}/instances`.
      - Check that the value of the returned HTTP status header is 200.
      - In the CoverageJSON response, ensure that the first value of ``domain.axes.t.values`` is equal to the last instance (``id``) from the `/collections/{collectionId}/instances` response captured earlier in this test.
  - id: encoding
    requirement_id: encoding
    conformance_class: data-query-response-format
    test_purpose: Validate that a MetOcean EDR API has the correct response format for data queries.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - In the returned document, for each object in `data_queries` for each collection in `collections` make a corresponding data query request and check that the returned response has status 200 and has an HTTP response header `Content-Type` with value `application/vnd.cov+json`.
  - id: referencing
    requirement_id: referencing
    conformance_class: data-query-response-format
    test_purpose: Validate that a MetOcean EDR Profile API CoverageJSON response document provides correct domain referencing values.
    steps:
      - Issue an HTTP GET request to path `/collections`.
      - Check that the value of the returned HTTP status header is 200.
      - For each object in the `collections` array, for each object in `data_queries`, issue a GET request with no crs query parameter specified.
      - Check that the response is a CoverageJSON document where each object of `type` `Coverage` contains a `domain.referencing` array which includes an object where `system.type` is set to `GeographicCRS` and `system.id` set to `OGC:CRS84`.
      - For each object in the `collections` array, for each object in `data_queries`, issue a GET request for each `crs_details` object where `crs` query parameter set to the value in the `crs_details` object.
      - Check that the response is a CoverageJSON object where `domain.referencing` includes an object where `system.type` is set to `GeographicCRS` and `system.id` is equal to the crs query parameter.
