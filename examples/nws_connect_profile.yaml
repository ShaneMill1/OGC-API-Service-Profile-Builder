name: nws_connect
title: NWS Connect Service Profile
version: "1.0"
description: >
  OGC API - EDR Part 3 Service Profile for NWS Connect: real-time GeoJSON
  notification messages for water gauge observations, NWS Weather Watches,
  Warnings and Advisories, and NOAA SWPC space weather alerts, delivered over
  EDR Part 2 PubSub (native WebSocket, AMQP 1.0, and MQTT) alongside the
  standard EDR Part 1 Features endpoints.
keywords:
  - water gauge
  - flood
  - weather warnings
  - watches
  - advisories
  - CAP
  - space weather
  - SWPC
  - real-time
  - pubsub
server_url: https://edr-api-desi-c.mdl.nws.noaa.gov/nws_connect_pygeoapi

provider:
  name: NOAA/NWS/Meteorological Development Laboratory (MDL)
  url: https://www.weather.gov/mdl/
  contact:
    email: nws.mdl.support@noaa.gov
    instructions: Data provided by the National Weather Service.
    country: USA

collections:
  - id: water_gauge
    title: Water Gauge Data
    description: Real-time GeoJSON notification messages for water gauge observations including flood stage information
    keywords:
      - water
      - gauge
      - notification
      - flood
      - USGS
      - real-time
    links:
      - href: https://edr-api-desi-c.mdl.nws.noaa.gov/nws_connect_pygeoapi/collections/water_gauge
        rel: self
        type: application/json
      - href: https://www.weather.gov/disclaimer
        rel: terms-of-use
        type: text/html
        title: Terms of Use
    extent:
      spatial:
        bbox:
          - [-180, -90, 180, 90]
        crs: "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      temporal:
        interval:
          - ["2024-01-01T00:00:00Z", "2025-12-31T23:59:59Z"]
        values:
          - "2024-01-01T00:00:00Z/2025-12-31T23:59:59Z"
        trs: "http://www.opengis.net/def/uom/ISO-8601/0/Gregorian"
    parameter_names:
      flood_stage:
        type: Parameter
        id: flood_stage
        description: Flood stage classification (major, moderate, minor, action, below_action, unknown)
        observedProperty:
          id: flood_stage
          label: Flood Stage
        unit:
          label: category
          symbol: category
      feet_above_stage:
        type: Parameter
        id: feet_above_stage
        description: Feet of observation above the observed flood stage
        observedProperty:
          id: feet_above_stage
          label: Feet Above Stage
        unit:
          label: feet
          symbol: ft
      value:
        type: Parameter
        id: value
        description: Water gauge observation value
        observedProperty:
          id: gauge_height
          label: Gauge Height
        unit:
          label: feet
          symbol: ft

  - id: wwa
    title: Weather Watches and Warnings
    description: NWS Weather Watches and Warnings from CAP (Common Alerting Protocol) alerts
    keywords:
      - weather
      - warnings
      - watches
      - alerts
      - CAP
      - real-time
    links:
      - href: https://edr-api-desi-c.mdl.nws.noaa.gov/nws_connect_pygeoapi/collections/wwa
        rel: self
        type: application/json
      - href: https://www.weather.gov/disclaimer
        rel: terms-of-use
        type: text/html
        title: Terms of Use
    extent:
      spatial:
        bbox:
          - [-180, -90, 180, 90]
        crs: "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      temporal:
        interval:
          - ["2024-01-01T00:00:00Z", "2025-12-31T23:59:59Z"]
        values:
          - "2024-01-01T00:00:00Z/2025-12-31T23:59:59Z"
        trs: "http://www.opengis.net/def/uom/ISO-8601/0/Gregorian"
    parameter_names:
      CAP_info_event:
        type: Parameter
        id: CAP_info_event
        description: Event type (e.g., Tornado Warning, Flood Watch)
        observedProperty:
          id: event_type
          label: Event Type
        unit:
          label: category
          symbol: category
      CAP_info_severity:
        type: Parameter
        id: CAP_info_severity
        description: Severity level (Extreme, Severe, Moderate, Minor, Unknown)
        observedProperty:
          id: severity
          label: Severity
        unit:
          label: category
          symbol: category
      CAP_info_urgency:
        type: Parameter
        id: CAP_info_urgency
        description: Urgency level (Immediate, Expected, Future, Past, Unknown)
        observedProperty:
          id: urgency
          label: Urgency
        unit:
          label: category
          symbol: category
      CAP_status:
        type: Parameter
        id: CAP_status
        description: Alert status (Actual, Exercise, System, Test, Draft)
        observedProperty:
          id: status
          label: Status
        unit:
          label: category
          symbol: category

  - id: space_weather
    title: NOAA SWPC Space Weather Alerts
    description: Alerts, warnings, watches, and summaries from the NOAA Space Weather Prediction Center (SWPC). Includes geomagnetic storms (G-scale), solar radiation storms (S-scale), and radio blackouts (R-scale).
    keywords:
      - space weather
      - SWPC
      - geomagnetic
      - solar
      - radio blackout
      - alerts
    links:
      - href: https://edr-api-desi-c.mdl.nws.noaa.gov/nws_connect_pygeoapi/collections/space_weather
        rel: self
        type: application/json
      - href: https://www.swpc.noaa.gov/products/alerts-watches-and-warnings
        rel: related
        type: text/html
        title: SWPC Alerts, Watches and Warnings
    extent:
      spatial:
        bbox:
          - [-180, -90, 180, 90]
        crs: "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      temporal:
        interval:
          - ["2024-01-01T00:00:00Z", "2025-12-31T23:59:59Z"]
        values:
          - "2024-01-01T00:00:00Z/2025-12-31T23:59:59Z"
        trs: "http://www.opengis.net/def/uom/ISO-8601/0/Gregorian"
    parameter_names:
      message_type:
        type: Parameter
        id: message_type
        description: Type of space weather message (Alert, Warning, Watch, Summary)
        observedProperty:
          id: message_type
          label: Message Type
        unit:
          label: category
          symbol: category
      noaa_scale:
        type: Parameter
        id: noaa_scale
        description: NOAA Space Weather Scale designation (G1-G5, S1-S5, R1-R5)
        observedProperty:
          id: noaa_scale
          label: NOAA Scale
        unit:
          label: category
          symbol: category
      scale_category:
        type: Parameter
        id: scale_category
        description: Scale category letter (G=Geomagnetic, S=Solar Radiation, R=Radio Blackout)
        observedProperty:
          id: scale_category
          label: Scale Category
        unit:
          label: category
          symbol: category
      scale_level:
        type: Parameter
        id: scale_level
        description: Numeric severity level (1=Minor through 5=Extreme)
        observedProperty:
          id: scale_level
          label: Scale Level
        unit:
          label: level
          symbol: level

  - id: cwa
    title: NWS County Warning Areas
    description: Geographic boundaries of NWS County Warning Areas (CWA) in WKT format
      - NWS
      - CWA
      - boundaries
      - geographic
    links:
      - href: https://edr-api-desi-c.mdl.nws.noaa.gov/nws_connect_pygeoapi/collections/cwa
        rel: self
        type: application/json
      - href: https://www.weather.gov/disclaimer
        rel: terms-of-use
        type: text/html
        title: Terms of Use
    extent:
      spatial:
        bbox:
          - [-180, -90, 180, 90]
        crs: "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      temporal:
        interval:
          - ["2024-01-01T00:00:00Z", "2025-12-31T23:59:59Z"]
        values:
          - "2024-01-01T00:00:00Z/2025-12-31T23:59:59Z"
        trs: "http://www.opengis.net/def/uom/ISO-8601/0/Gregorian"
    parameter_names: {}

  - id: states
    title: States
    description: Geographic boundaries of states within the United States
    keywords:
      - NWS
      - states
      - boundaries
      - geographic
    links:
      - href: https://edr-api-desi-c.mdl.nws.noaa.gov/nws_connect_pygeoapi/collections/states
        rel: self
        type: application/json
      - href: https://www.weather.gov/disclaimer
        rel: terms-of-use
        type: text/html
        title: Terms of Use
    extent:
      spatial:
        bbox:
          - [-180, -90, 180, 90]
        crs: "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
      temporal:
        interval:
          - ["2024-01-01T00:00:00Z", "2025-12-31T23:59:59Z"]
        values:
          - "2024-01-01T00:00:00Z/2025-12-31T23:59:59Z"
        trs: "http://www.opengis.net/def/uom/ISO-8601/0/Gregorian"
    parameter_names: {}

pubsub:
  broker_host: edr-broker
  broker_port: 5672
  protocol: amqp1
  collections:
    - water_gauge
    - wwa
    - space_weather
  servers:
    - name: websocket_local
      description: Native pygeoapi live-map WebSocket (local development)
      host: ''
      protocol: ws
      pathname: /ws
    - name: websocket_secure
      description: Native pygeoapi live-map WebSocket (production)
      host: ''
      protocol: wss
      pathname: /ws
    - name: amqp
      description: >-
        AMQP 1.0 broker (edr-broker, RabbitMQ 4.x native AMQP 1.0). Consume from
        a queue bound to the amq.topic exchange with binding key
        collections.*.items (v2 source address /queues/<your-queue>; declare and
        bind it first). Authenticate with SASL PLAIN: your account email as the
        username and a named WebSocket key (POST /api/ws-keys, value starts with
        wsk_) as the password. Read-only; fire-and-forget (re-hydrate current
        state from /collections/{id}/items on reconnect).
      host: 'edr-broker:5672'
      protocol: amqp1
    - name: mqtt
      description: >-
        MQTT broker (edr-broker, RabbitMQ MQTT plugin over the same amq.topic
        exchange). Subscribe to topic collections/+/items (or a specific
        collections/<id>/items). Authenticate with your account email as the
        username and a named WebSocket key (wsk_...) as the password. Read-only;
        fire-and-forget.
      host: 'edr-broker:1883'
      protocol: mqtt
  collection_filters:
    water_gauge:
      filters:
        - name: flood_stages
          description: Alert for selected flood stages (below_action, action, minor, moderate, major)
          type: array
        - name: stations
          description: Comma-separated station IDs or 'all' for all stations
          type: string
        - name: wfo
          description: Weather Forecast Office codes (e.g., PHI, AKQ, OKX)
          type: string
        - name: email
          description: Email address for notifications
          type: string
    wwa:
      filters:
        - name: event_types
          description: Weather event types to subscribe to (e.g., Tornado Warning, Flood Watch)
          type: array
        - name: state
          description: Filter by state, or leave blank for all states
          type: string
        - name: cwa
          description: Filter by County Warning Area code
          type: string
        - name: email
          description: Email address for notifications
          type: string
    space_weather:
      filters:
        - name: message_type
          description: Filter by message type (Alert, Warning, Watch, Summary)
          type: string
        - name: scale_category
          description: Filter by NOAA scale category (G, S, R)
          type: string
        - name: scale_level
          description: Filter by minimum NOAA scale level (1-5)
          type: number
        - name: email
          description: Email address for notifications
          type: string

# OGC API - EDR Part 3 compliance fields
required_conformance_classes:
  - "http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/core"
  - "http://www.opengis.net/spec/ogcapi-edr-2/1.0/conf/pubsub"

extent_requirements:
  minimum_bbox: [-180, -90, 180, 90]
  extent_crs:
    allowed:
      - "http://www.opengis.net/def/crs/OGC/1.3/CRS84"
  extent_trs:
    allowed:
      - "http://www.opengis.net/def/uom/ISO-8601/0/Gregorian"

output_formats:
  - name: GeoJSON
    media_type: application/geo+json
    schema_ref: https://geojson.org/schema/FeatureCollection.json

requirements:
  - id: conformance
    statement: The service SHALL declare conformance to OGC API - EDR Part 1 Core and Part 2 PubSub.
    parts:
      - The service SHALL provide a /conformance endpoint.
      - The response SHALL include http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/core.
      - The response SHALL include http://www.opengis.net/spec/ogcapi-edr-2/1.0/conf/pubsub.

  - id: collections-endpoint
    statement: The service SHALL provide a /collections endpoint listing all collections.
    parts:
      - The service SHALL provide a /collections endpoint.
      - The response SHALL include water_gauge, wwa, space_weather, cwa, and states collections.
      - Each collection SHALL have id, title, description, extent, and links properties.

  - id: water-gauge-collection
    statement: The water_gauge collection SHALL provide GeoJSON features with flood stage information.
    parts:
      - The service SHALL provide a /collections/water_gauge endpoint.
      - The service SHALL provide a /collections/water_gauge/items endpoint.
      - The response Content-Type SHALL be application/geo+json.
      - Each feature SHALL include flood_stage, feet_above_stage, and value properties.
      - Each feature geometry SHALL be a GeoJSON Point.

  - id: wwa-collection
    statement: The wwa collection SHALL provide GeoJSON features for weather watches and warnings.
    parts:
      - The service SHALL provide a /collections/wwa endpoint.
      - The service SHALL provide a /collections/wwa/items endpoint.
      - The response Content-Type SHALL be application/geo+json.
      - Each feature SHALL include CAP_info_event, CAP_info_severity, CAP_info_urgency, and CAP_status properties.
      - Each feature geometry SHALL be a GeoJSON Polygon or MultiPolygon.

  - id: space-weather-collection
    statement: The space_weather collection SHALL provide GeoJSON features for NOAA SWPC space weather alerts.
    parts:
      - The service SHALL provide a /collections/space_weather endpoint.
      - The service SHALL provide a /collections/space_weather/items endpoint.
      - The response Content-Type SHALL be application/geo+json.
      - Each feature SHALL include message_type, noaa_scale, scale_category, and scale_level properties.

  - id: cwa-collection
    statement: The cwa collection SHALL provide GeoJSON features for NWS County Warning Areas.
    parts:
      - The service SHALL provide a /collections/cwa endpoint.
      - The service SHALL provide a /collections/cwa/items endpoint.
      - The response Content-Type SHALL be application/geo+json.
      - Each feature SHALL include a CWA identifier property.
      - Each feature geometry SHALL be a GeoJSON Polygon or MultiPolygon.

  - id: states-collection
    statement: The states collection SHALL provide GeoJSON features for US state boundaries.
    parts:
      - The service SHALL provide a /collections/states endpoint.
      - The service SHALL provide a /collections/states/items endpoint.
      - The response Content-Type SHALL be application/geo+json.
      - Each feature SHALL include a state identifier property.
      - Each feature geometry SHALL be a GeoJSON Polygon or MultiPolygon.

  - id: items-by-id
    statement: All collections SHALL support retrieval of individual features by ID.
    parts:
      - Each collection SHALL provide a /collections/{collectionId}/items/{featureId} endpoint.
      - The response SHALL return a single GeoJSON feature.
      - The response SHALL return 404 if the feature does not exist.

  - id: pubsub-amqp
    statement: The service SHALL support AMQP 1.0 and MQTT pub/sub for real-time notifications on water_gauge, wwa, and space_weather collections.
    parts:
      - The service SHALL provide an AMQP 1.0 broker (edr-broker) on port 5672 (RabbitMQ 4.x native AMQP 1.0).
      - The service SHALL provide an MQTT broker (edr-broker) on port 1883 over the same amq.topic exchange.
      - Clients SHALL be able to consume from a queue bound to amq.topic with binding key collections.water_gauge.items.
      - Clients SHALL be able to consume from a queue bound to amq.topic with binding key collections.wwa.items.
      - Clients SHALL be able to consume from a queue bound to amq.topic with binding key collections.space_weather.items.
      - Clients SHALL authenticate with SASL PLAIN using their account email as the username and a named WebSocket key (wsk_...) as the password.
      - Notifications SHALL be published as GeoJSON features.

  - id: pubsub-websocket
    statement: The service SHALL support a native WebSocket pub/sub endpoint for browser clients.
    parts:
      - The service SHALL provide a WebSocket endpoint at /ws for local development (ws) and production (wss).
      - The WebSocket endpoint SHALL deliver the same GeoJSON feature notifications as the AMQP 1.0 and MQTT transports.
      - WebSocket connections SHALL authenticate with the same identity used for the AMQP/MQTT transports.

  - id: pubsub-filters-water-gauge
    statement: The water_gauge collection pub/sub SHALL support filtering by flood stages, stations, and WFO.
    parts:
      - Subscriptions SHALL accept flood_stages filter (array of stage values).
      - Subscriptions SHALL accept stations filter (comma-separated station IDs or 'all').
      - Subscriptions SHALL accept wfo filter (Weather Forecast Office codes).
      - Subscriptions SHALL accept email filter for notification delivery.

  - id: pubsub-filters-wwa
    statement: The wwa collection pub/sub SHALL support filtering by event types, state, and CWA.
    parts:
      - Subscriptions SHALL accept event_types filter (array of weather event types).
      - Subscriptions SHALL accept state filter (state code or blank for all).
      - Subscriptions SHALL accept cwa filter (County Warning Area code).
      - Subscriptions SHALL accept email filter for notification delivery.

  - id: pubsub-filters-space-weather
    statement: The space_weather collection pub/sub SHALL support filtering by message type and NOAA scale.
    parts:
      - Subscriptions SHALL accept message_type filter (Alert, Warning, Watch, Summary).
      - Subscriptions SHALL accept scale_category filter (G, S, R).
      - Subscriptions SHALL accept scale_level filter (minimum NOAA scale level 1-5).
      - Subscriptions SHALL accept email filter for notification delivery.

abstract_tests:
  - id: conformance
    requirement_id: conformance
    steps:
      - Send GET request to /conformance.
      - Verify response contains http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/core.
      - Verify response contains http://www.opengis.net/spec/ogcapi-edr-2/1.0/conf/pubsub.

  - id: collections-endpoint
    requirement_id: collections-endpoint
    steps:
      - Send GET request to /collections.
      - Verify response contains collections array.
      - Verify water_gauge, wwa, space_weather, cwa, and states are present in the collections array.
      - Verify each collection has id, title, description, extent, and links.

  - id: water-gauge-collection
    requirement_id: water-gauge-collection
    steps:
      - Send GET request to /collections/water_gauge.
      - Verify response contains collection metadata.
      - Send GET request to /collections/water_gauge/items?limit=10.
      - Verify response Content-Type is application/geo+json.
      - Verify each feature contains flood_stage, feet_above_stage, and value properties.
      - Verify each feature geometry type is Point.

  - id: wwa-collection
    requirement_id: wwa-collection
    steps:
      - Send GET request to /collections/wwa.
      - Verify response contains collection metadata.
      - Send GET request to /collections/wwa/items?limit=10.
      - Verify response Content-Type is application/geo+json.
      - Verify each feature contains CAP_info_event, CAP_info_severity, CAP_info_urgency, and CAP_status properties.
      - Verify each feature geometry type is Polygon or MultiPolygon.

  - id: space-weather-collection
    requirement_id: space-weather-collection
    steps:
      - Send GET request to /collections/space_weather.
      - Verify response contains collection metadata.
      - Send GET request to /collections/space_weather/items?limit=10.
      - Verify response Content-Type is application/geo+json.
      - Verify each feature contains message_type, noaa_scale, scale_category, and scale_level properties.

  - id: cwa-collection
    requirement_id: cwa-collection
    steps:
      - Send GET request to /collections/cwa.
      - Verify response contains collection metadata.
      - Send GET request to /collections/cwa/items?limit=10.
      - Verify response Content-Type is application/geo+json.
      - Verify each feature contains a CWA identifier.
      - Verify each feature geometry type is Polygon or MultiPolygon.

  - id: states-collection
    requirement_id: states-collection
    steps:
      - Send GET request to /collections/states.
      - Verify response contains collection metadata.
      - Send GET request to /collections/states/items?limit=10.
      - Verify response Content-Type is application/geo+json.
      - Verify each feature contains a state identifier.
      - Verify each feature geometry type is Polygon or MultiPolygon.

  - id: items-by-id
    requirement_id: items-by-id
    steps:
      - Send GET request to /collections/water_gauge/items?limit=1.
      - Extract the id of the first feature.
      - Send GET request to /collections/water_gauge/items/{featureId}.
      - Verify response is a single GeoJSON feature with matching id.
      - Send GET request to /collections/water_gauge/items/nonexistent.
      - Verify response status is 404.

  - id: pubsub-amqp
    requirement_id: pubsub-amqp
    steps:
      - Connect to the AMQP 1.0 broker (edr-broker) on port 5672 using SASL PLAIN (email + wsk_ key).
      - Declare a queue and bind it to the amq.topic exchange with binding key collections.water_gauge.items.
      - Verify notifications are received as GeoJSON features.
      - Bind a queue to amq.topic with binding key collections.wwa.items.
      - Verify notifications are received as GeoJSON features.
      - Connect to the MQTT broker (edr-broker) on port 1883 and subscribe to topic collections/+/items.
      - Verify notifications are received as GeoJSON features.

  - id: pubsub-websocket
    requirement_id: pubsub-websocket
    steps:
      - Connect to the native WebSocket endpoint at /ws (ws locally, wss in production).
      - Verify the connection succeeds and delivers GeoJSON feature notifications.
      - Verify notifications match those delivered over the AMQP 1.0 and MQTT transports.

  - id: pubsub-filters-water-gauge
    requirement_id: pubsub-filters-water-gauge
    steps:
      - Subscribe to collections/water_gauge/items/# with flood_stages filter set to ["major", "moderate"].
      - Verify only notifications matching the specified flood stages are received.
      - Subscribe with stations filter set to specific station IDs.
      - Verify only notifications for those stations are received.
      - Subscribe with wfo filter set to a specific office code.
      - Verify only notifications for that WFO are received.

  - id: pubsub-filters-wwa
    requirement_id: pubsub-filters-wwa
    steps:
      - Subscribe to collections/wwa/items/# with event_types filter set to ["Tornado Warning"].
      - Verify only notifications matching the specified event types are received.
      - Subscribe with state filter set to a specific state code.
      - Verify only notifications for that state are received.
      - Subscribe with cwa filter set to a specific CWA code.
      - Verify only notifications for that CWA are received.

  - id: pubsub-filters-space-weather
    requirement_id: pubsub-filters-space-weather
    steps:
      - Subscribe to collections/space_weather/items/# with message_type filter set to "Warning".
      - Verify only notifications matching the specified message type are received.
      - Subscribe with scale_category filter set to "G".
      - Verify only geomagnetic-storm notifications are received.
      - Subscribe with scale_level filter set to 3.
      - Verify only notifications at or above NOAA scale level 3 are received.

