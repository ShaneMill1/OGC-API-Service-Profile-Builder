name: Generate profile artifacts
description: Paste your profile configuration and get generated artifacts (OpenAPI, AsciiDoc, requirements, optional PDF) back as a downloadable zip.
title: "[profile request] "
labels: ["profile-request"]
body:
  - type: markdown
    attributes:
      value: |
        ## Generate OGC API profile artifacts

        Paste your profile config below and submit. A bot will validate it,
        generate the artifacts, and comment on this issue with a link to
        download them as a zip. No fork or install required — you just need a
        GitHub account.

        Not sure what a config looks like? Start from an
        [example profile](https://github.com/${{ github.repository }}/tree/main/examples).
  - type: textarea
    id: config
    attributes:
      label: Profile configuration (YAML)
      description: Paste the full contents of your profile YAML. It is rendered as a code block, so indentation is preserved.
      render: yaml
      placeholder: |
        name: my_profile
        title: My Service Profile
        version: "1.0"
        # ... rest of your config ...
    validations:
      required: true
  - type: textarea
    id: assets
    attributes:
      label: Additional assets (optional)
      description: |
        If your profile references local files — for example a cover logo via
        `document_metadata.cover.logo` — drag-and-drop them into the box below.
        GitHub will upload each file and insert either a Markdown link or an
        `<img>` tag; leave what it inserts alone.

        **Reference each uploaded file in your YAML as `uploads/<original-filename>`.**
        For example, if you drop `my_logo.png` here, set:

        ```yaml
        document_metadata:
          cover:
            logo: uploads/my_logo.png
        ```

        The workflow downloads each attachment into `./uploads/`, using the
        original filename it can recover from the upload (Content-Disposition,
        redirect URL, or the `alt` text GitHub sets from the filename you
        dropped). If nothing else resolves the name, the workflow saves the
        file under GitHub's UUID — in that case, use the file listing printed
        by the "Download attached assets" step in the workflow log to see the
        exact filename to reference.

        Supported by GitHub's drag-and-drop uploader: PNG, JPG, GIF, SVG, PDF,
        ZIP, and a few others. Leave this empty if your profile has no local
        file references.
      placeholder: Drag-and-drop files here...
    validations:
      required: false
  - type: dropdown
    id: pdf
    attributes:
      label: Compile a PDF?
      description: PDF generation uses Metanorma and adds a few minutes to the run.
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: Acknowledgement
      options:
        - label: My configuration does not contain any secrets or sensitive data. I understand the generated artifacts will be attached to a public workflow run.
          required: true
