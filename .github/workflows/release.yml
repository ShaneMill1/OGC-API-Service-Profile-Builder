name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v2.1.5)
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oapi-profile-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Build and release profile artifacts
    runs-on: ubuntu-latest
    # Wait for the PyPI publish so the version this job installs from PyPI exists.
    needs: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the "commit refreshed generated/" step can place the
          # refreshed artifacts on top of main and push (the workflow is
          # tag-triggered — detached HEAD — so we switch to main in that step).
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            # Strip leading 'v' for pip version
            echo "pip_version=${${{ github.event.inputs.tag }}#v}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "pip_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # Poll the PyPI JSON API (not pip, which caches negative lookups) until the
      # just-published version is listed, so index propagation lag can't cause the
      # downstream `uses: ./` install steps to fail. Generous window (~10 min).
      - name: Wait for PyPI to list the version
        id: pypi_wait
        run: |
          VERSION="${{ steps.version.outputs.pip_version }}"
          echo "Waiting for oapi-profile-builder==${VERSION} to appear on PyPI..."
          found=""
          for attempt in $(seq 1 60); do
            if curl -fsSL "https://pypi.org/pypi/oapi-profile-builder/${VERSION}/json" -o /dev/null 2>/dev/null; then
              echo "Version ${VERSION} is live on PyPI (attempt ${attempt})."
              found="yes"
              break
            fi
            echo "  not yet listed (attempt ${attempt}/60); sleeping 10s..."
            sleep 10
          done
          if [ -z "$found" ]; then
            echo "::warning::oapi-profile-builder==${VERSION} not visible on PyPI after ~10 min; artifact generation may fail, but the GitHub Release will still be created."
            echo "pypi_ready=false" >> $GITHUB_OUTPUT
          else
            echo "pypi_ready=true" >> $GITHUB_OUTPUT
          fi

      # Install the just-published package (with the [pdf] extra for cover-image
      # generation) so the generator CLI is available for the regeneration loop.
      - name: Install oapi-profile-builder
        if: steps.pypi_wait.outputs.pypi_ready == 'true'
        run: pip install "oapi-profile-builder[pdf]==${{ steps.version.outputs.pip_version }}"

      # Regenerate every example profile's artifacts (OpenAPI/AsyncAPI, AsciiDoc,
      # and a Metanorma PDF) into generated/<name>/, so the committed snapshots in
      # the repo always match the released version. Each profile is independent:
      # a failure in one does not abort the others or the release.
      - name: Regenerate committed profile artifacts (with PDF)
        if: steps.pypi_wait.outputs.pypi_ready == 'true'
        continue-on-error: true
        run: |
          set +e
          mkdir -p release_artifacts
          for cfg in examples/*.yaml; do
            name="$(basename "$cfg" .yaml)"
            echo "::group::Generating $name (with PDF)"
            tmp="$(mktemp -d)"
            oapi-profile-builder generate --config "$cfg" --output "$tmp" --pdf
            status=$?
            if [ $status -ne 0 ] || [ ! -f "$tmp/document.adoc" ]; then
              echo "::warning::generation failed for $name (exit $status); keeping existing committed artifacts"
              echo "::endgroup::"
              continue
            fi
            # Metanorma runs in Docker as root and leaves a root-owned relaton/
            # cache plus build logs; drop build byproducts, keep meaningful output.
            sudo rm -rf "$tmp/relaton" 2>/dev/null || rm -rf "$tmp/relaton" 2>/dev/null || true
            rm -f "$tmp"/*.log.txt "$tmp/document.err.html" \
                  "$tmp/document.presentation.xml" "$tmp/document.xml" "$tmp"/*.pdf.err 2>/dev/null || true
            # Replace the committed snapshot with the fresh output.
            rm -rf "generated/$name"
            mkdir -p "generated/$name"
            cp -a "$tmp"/. "generated/$name"/
            rm -rf "$tmp"
            # Package a zip of the full artifact set (top-level folder = <name>/).
            ( cd generated && zip -rq "$GITHUB_WORKSPACE/release_artifacts/${name}_artifacts.zip" "$name" )
            # Stage the PDF under a clearly named release asset too.
            if [ -f "generated/$name/document.pdf" ]; then
              cp "generated/$name/document.pdf" "release_artifacts/${name}.pdf"
            fi
            echo "::endgroup::"
          done
          echo "Regenerated artifacts:"; ls -R generated/ | head -40

      # Commit the refreshed generated/ snapshots back to the default branch so
      # the repo's committed artifacts always track the latest release. The
      # workflow is tag-triggered (detached HEAD), so commit explicitly to main.
      - name: Commit refreshed generated/ artifacts to main
        if: steps.pypi_wait.outputs.pypi_ready == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The workflow checks out the tag (detached HEAD). Move the freshly
          # regenerated generated/ working-tree changes onto the tip of main so
          # the commit lands on the branch, then push.
          git fetch origin main
          git stash push -u -- generated/ || true
          git checkout -B main origin/main
          git stash pop || true
          git add generated/
          if git diff --cached --quiet; then
            echo "No changes to generated/ — committed artifacts already current."
            exit 0
          fi
          git commit -m "ci: refresh generated/ profile artifacts for ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin main

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.pip_version }}"
          TAG="${{ steps.version.outputs.tag }}"
          # Extract the section for this version from CHANGELOG.md
          # (everything between "## [VERSION]" and the next "## [" heading).
          SECTION=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          {
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            else
              echo "## ${TAG}"
              echo
              echo "See [CHANGELOG.md](CHANGELOG.md) for details."
            fi
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "pip install oapi-profile-builder==${VERSION}"
            echo '```'
            echo
            echo "### Use in GitHub Actions"
            echo
            echo '```yaml'
            echo "- uses: ShaneMill1/OGC-API-Service-Profile-Builder@${TAG}"
            echo "    with:"
            echo "      config: my_profile.yaml"
            echo "      output: ./profile_output"
            echo '```'
            echo
            echo "### Generated Profile Artifacts"
            echo
            echo "For each example profile, this release attaches:"
            echo
            echo "- \`<profile>_artifacts.zip\` — the full artifact set (openapi.yaml, asyncapi.yaml when pubsub is configured, profile_config.json, document.adoc, requirements/, abstract_tests/, sections/)."
            echo "- \`<profile>.pdf\` — the compiled Metanorma document (e.g. \`metocean_profile.pdf\`)."
            echo
            echo "The same artifacts are also committed to the repository under \`generated/<profile>/\` and kept in sync with each release."
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      # Always create/update the GitHub Release — even if artifact generation was
      # skipped or failed (e.g. PyPI propagation lag). The Release only needs the
      # tag + notes; any artifact zips that were produced are attached, and the
      # glob tolerates missing files so a partial/empty artifact set never blocks
      # the Release. A later re-run of this job will attach the zips.
      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          # Attach every example profile's artifact zip and its compiled PDF
          # (e.g. metocean_profile.pdf). Globs tolerate missing files so a
          # partial artifact set never blocks the Release.
          files: |
            release_artifacts/*_artifacts.zip
            release_artifacts/*.pdf
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
