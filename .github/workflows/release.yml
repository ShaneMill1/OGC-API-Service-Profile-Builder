name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v2.1.5)
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oapi-profile-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Build and release profile artifacts
    runs-on: ubuntu-latest
    # Wait for the PyPI publish so the version this job installs from PyPI exists.
    needs: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            # Strip leading 'v' for pip version
            echo "pip_version=${${{ github.event.inputs.tag }}#v}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "pip_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Generate minimal profile artifacts
        uses: ./
        with:
          config: examples/minimal_profile.yaml
          output: ./release_artifacts/minimal_profile
          version: ${{ steps.version.outputs.pip_version }}

      - name: Generate insitu observations profile artifacts
        uses: ./
        with:
          config: examples/insitu_observations_profile.yaml
          output: ./release_artifacts/insitu_observations_profile
          version: ${{ steps.version.outputs.pip_version }}

      - name: Generate nwsviz profile artifacts
        uses: ./
        with:
          config: examples/nwsviz_profile.yaml
          output: ./release_artifacts/nwsviz_profile
          version: ${{ steps.version.outputs.pip_version }}

      - name: Package artifacts
        run: |
          cd release_artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}_artifacts.zip" "$dir"
            echo "Packaged ${name}_artifacts.zip"
          done
          ls -lh ../*.zip

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.pip_version }}"
          TAG="${{ steps.version.outputs.tag }}"
          # Extract the section for this version from CHANGELOG.md
          # (everything between "## [VERSION]" and the next "## [" heading).
          SECTION=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          {
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            else
              echo "## ${TAG}"
              echo
              echo "See [CHANGELOG.md](CHANGELOG.md) for details."
            fi
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "pip install oapi-profile-builder==${VERSION}"
            echo '```'
            echo
            echo "### Use in GitHub Actions"
            echo
            echo '```yaml'
            echo "- uses: ShaneMill1/OGC-API-Service-Profile-Builder@${TAG}"
            echo "    with:"
            echo "      config: my_profile.yaml"
            echo "      output: ./profile_output"
            echo '```'
            echo
            echo "### Generated Profile Artifacts"
            echo
            echo "The attached zips contain the full set of generated artifacts (openapi.yaml, asyncapi.yaml when pubsub is configured, profile_config.json, document.adoc, requirements/, abstract_tests/, sections/) for each example profile."
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          files: |
            minimal_profile_artifacts.zip
            insitu_observations_profile_artifacts.zip
            nwsviz_profile_artifacts.zip
          draft: false
          prerelease: false
