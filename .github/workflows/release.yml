name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v2.1.5)
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/oapi-profile-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: Build and release profile artifacts
    runs-on: ubuntu-latest
    # Wait for the PyPI publish so the version this job installs from PyPI exists.
    needs: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            # Strip leading 'v' for pip version
            echo "pip_version=${${{ github.event.inputs.tag }}#v}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "pip_version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      # Poll the PyPI JSON API (not pip, which caches negative lookups) until the
      # just-published version is listed, so index propagation lag can't cause the
      # downstream `uses: ./` install steps to fail. Generous window (~10 min).
      - name: Wait for PyPI to list the version
        id: pypi_wait
        run: |
          VERSION="${{ steps.version.outputs.pip_version }}"
          echo "Waiting for oapi-profile-builder==${VERSION} to appear on PyPI..."
          found=""
          for attempt in $(seq 1 60); do
            if curl -fsSL "https://pypi.org/pypi/oapi-profile-builder/${VERSION}/json" -o /dev/null 2>/dev/null; then
              echo "Version ${VERSION} is live on PyPI (attempt ${attempt})."
              found="yes"
              break
            fi
            echo "  not yet listed (attempt ${attempt}/60); sleeping 10s..."
            sleep 10
          done
          if [ -z "$found" ]; then
            echo "::warning::oapi-profile-builder==${VERSION} not visible on PyPI after ~10 min; artifact generation may fail, but the GitHub Release will still be created."
            echo "pypi_ready=false" >> $GITHUB_OUTPUT
          else
            echo "pypi_ready=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate minimal profile artifacts
        if: steps.pypi_wait.outputs.pypi_ready == 'true'
        continue-on-error: true
        uses: ./
        with:
          config: examples/minimal_profile.yaml
          output: ./release_artifacts/minimal_profile
          version: ${{ steps.version.outputs.pip_version }}

      - name: Generate insitu observations profile artifacts
        if: steps.pypi_wait.outputs.pypi_ready == 'true'
        continue-on-error: true
        uses: ./
        with:
          config: examples/insitu_observations_profile.yaml
          output: ./release_artifacts/insitu_observations_profile
          version: ${{ steps.version.outputs.pip_version }}

      - name: Generate nwsviz profile artifacts
        if: steps.pypi_wait.outputs.pypi_ready == 'true'
        continue-on-error: true
        uses: ./
        with:
          config: examples/nwsviz_profile.yaml
          output: ./release_artifacts/nwsviz_profile
          version: ${{ steps.version.outputs.pip_version }}

      - name: Package artifacts
        continue-on-error: true
        run: |
          mkdir -p release_artifacts
          cd release_artifacts
          shopt -s nullglob
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}_artifacts.zip" "$dir"
            echo "Packaged ${name}_artifacts.zip"
          done
          ls -lh ../*.zip 2>/dev/null || echo "No artifact zips produced."

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.pip_version }}"
          TAG="${{ steps.version.outputs.tag }}"
          # Extract the section for this version from CHANGELOG.md
          # (everything between "## [VERSION]" and the next "## [" heading).
          SECTION=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          {
            if [ -n "$SECTION" ]; then
              echo "$SECTION"
            else
              echo "## ${TAG}"
              echo
              echo "See [CHANGELOG.md](CHANGELOG.md) for details."
            fi
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "pip install oapi-profile-builder==${VERSION}"
            echo '```'
            echo
            echo "### Use in GitHub Actions"
            echo
            echo '```yaml'
            echo "- uses: ShaneMill1/OGC-API-Service-Profile-Builder@${TAG}"
            echo "    with:"
            echo "      config: my_profile.yaml"
            echo "      output: ./profile_output"
            echo '```'
            echo
            echo "### Generated Profile Artifacts"
            echo
            echo "The attached zips contain the full set of generated artifacts (openapi.yaml, asyncapi.yaml when pubsub is configured, profile_config.json, document.adoc, requirements/, abstract_tests/, sections/) for each example profile."
          } > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      # Always create/update the GitHub Release — even if artifact generation was
      # skipped or failed (e.g. PyPI propagation lag). The Release only needs the
      # tag + notes; any artifact zips that were produced are attached, and the
      # glob tolerates missing files so a partial/empty artifact set never blocks
      # the Release. A later re-run of this job will attach the zips.
      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          files: |
            minimal_profile_artifacts.zip
            insitu_observations_profile_artifacts.zip
            nwsviz_profile_artifacts.zip
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          make_latest: true
