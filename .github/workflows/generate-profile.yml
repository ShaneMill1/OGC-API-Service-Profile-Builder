name: Generate Profile Artifacts

# Artifacts are no longer generated and committed automatically on push.
# Instead:
#   - Users generate artifacts on demand via the "Generate profile artifacts"
#     issue form (see .github/workflows/profile-request.yml).
#   - Maintainers can validate the example profiles on PRs, or regenerate them
#     manually via workflow_dispatch (artifacts are uploaded, not committed).

on:
  pull_request:
    paths:
      - 'examples/**_profile.yaml'
      - 'examples/minimal_profile.yaml'
      - 'src/**'
      - 'action.yml'
  workflow_dispatch:
    inputs:
      config:
        description: Profile config file to generate (relative path)
        required: false
        default: examples/insitu_observations_profile.yaml
      pdf:
        description: Compile a PDF via Metanorma
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  # Validate that the example profiles still generate cleanly. Runs the full
  # example matrix on PRs; on manual dispatch, generates just the requested
  # config. Artifacts are uploaded for inspection but never committed back.
  generate:
    name: Generate — ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.config)) || fromJSON('["examples/minimal_profile.yaml","examples/insitu_observations_profile.yaml","examples/nwsviz_profile.yaml"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile artifacts
        uses: ./
        with:
          config: ${{ matrix.profile }}
          output: ./output/${{ matrix.profile }}
          version: latest
          pdf: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pdf || 'false' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: profile-artifacts-${{ hashFiles(matrix.profile) }}
          path: ./output/${{ matrix.profile }}/
          retention-days: 30
