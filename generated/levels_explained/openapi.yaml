                          type: array
                          items:
                            type: string
                        output_formats:
                          type: array
                          items:
                            type: string
                        parameter_names:
                          type: object
                          additionalProperties: false
                          properties:
                            value:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                description:
                                  type: string
                                  enum:
                                  - Example parameter
                                  default: Example parameter
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Example value
                                      default: Example value
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - unitless
                                      default: unitless
