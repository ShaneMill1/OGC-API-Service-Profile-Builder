openapi: 3.0.0
info:
  title: In-situ Observations EDR Profile
  version: '1.0'
  description: 'OGC API - EDR Part 3 Service Profile: In-situ Observations EDR Profile'
  x-ogc-profile: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/insitu_observations_profile
  x-keywords: []
  contact:
    name: In-situ Observations EDR Profile
servers:
- url: /
  description: Placeholder server URL. Per OGC API - EDR Part 3 REQ_publishing, this
    profile document is implementation-independent. Implementations SHALL substitute
    their own server URL.
tags:
- name: server
  description: In-situ Observations EDR Profile
- name: insitu-observations
  description: Real-time in-situ meteorological observations from surface stations.
    Provides air temperature, wind, humidity, pressure, precipitation, and dew point
    at standard measurement heights.
