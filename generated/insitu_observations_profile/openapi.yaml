                                      default: https://vocab.nerc.ac.uk/standard_name/dew_point_temperature
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Kelvin
                                      default: Kelvin
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - K
                                          default: K
                                        type:
                                          type: string
                                          enum:
                                          - https://qudt.org/vocab/unit/K
                                          default: https://qudt.org/vocab/unit/K
                        extent:
                          type: object
                          required:
                          - spatial
                          properties:
                            spatial:
                              type: object
                              required:
                              - bbox
                              - crs
                              properties:
                                bbox:
                                  type: array
                                  items:
                                    type: array
                                    items:
                                      type: number
                                  example:
                                  - - -180.0
                                    - -90.0
                                    - 180.0
                                    - 90.0
                                crs:
                                  type: string
                                  example: http://www.opengis.net/def/crs/OGC/1.3/CRS84
                            temporal:
                              type: object
                              required:
                              - trs
                              properties:
                                trs:
                                  type: string
                                  example: Gregorian
                                interval:
                                  type: array
                                  items:
                                    type: array
                                    items:
                                      type: string
                                      nullable: true
                                  example:
                                  - - 2020-01-01 00:00:00+00:00
                                    - 2026-12-31 23:59:59+00:00
                                values:
                                  type: array
                                  items:
                                    type: string
                                  example:
                                  - 2020-01-01T00:00:00Z/2026-12-31T23:59:59Z
                            custom:
                              type: array
                              items:
                                oneOf:
                                - type: object
                                  required:
                                  - id
                                  - interval
                                  - reference
                                  properties:
                                    id:
                                      type: string
                                      example: standard_name
                                    interval:
                                      type: array
                                      items:
                                        type: string
                                      example: []
                                    reference:
                                      type: string
                                      example: https://vocab.nerc.ac.uk/standard_name/
                                - type: object
                                  required:
                                  - id
                                  - interval
                                  - reference
                                  properties:
                                    id:
                                      type: string
                                      example: level
                                    interval:
                                      type: array
                                      items:
                                        type: string
                                      example: []
                                    reference:
                                      type: string
                                      example: Height of measurement above ground
                                        level in meters
                        data_queries:
                          type: object
                          properties:
                            radius:
                              type: object
                              properties:
                                link:
                                  type: object
                                  properties:
                                    href:
                                      type: string
                                      example: https://example.com/collections/insitu-observations/radius
                                    rel:
                                      type: string
                                      example: data
                                    variables:
                                      type: object
                                      properties:
