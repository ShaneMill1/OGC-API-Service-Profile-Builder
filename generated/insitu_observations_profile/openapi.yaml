  /collections/insitu-observations:
    get:
      summary: Get In-situ meteorological observations metadata
      description: Real-time in-situ meteorological observations from surface stations.
        Provides air temperature, wind, humidity, pressure, precipitation, and dew
        point at standard measurement heights.
      operationId: DescribeInsituObservationsCollection
      tags:
      - insitu-observations
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Collection metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - links
                - extent
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  keywords:
                    type: array
                    items:
                      type: string
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                  crs:
                    type: array
                    items:
                      type: string
                      enum:
                      - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                      - http://www.opengis.net/def/crs/EPSG/0/4326
                      - http://www.opengis.net/def/crs/EPSG/0/3857
                  output_formats:
                    type: array
                    items:
                      type: string
                      enum:
                      - CoverageJSON
                      - GeoJSON
                  parameter_names:
                    type: object
                    additionalProperties:
                      type: object
                      title: Parameter name
                      description: Definition of a data parameter in this collection
                      required:
                      - type
                      - observedProperty
                      - measurementType
                      - label
                      - description
                      - unit
                      - metocean:standard_name
                      - metocean:level
                      properties:
                        type:
                          type: string
                          enum:
                          - Parameter
                        label:
                          type: string
                          description: Human-readable parameter name (max 50 characters,
                            English)
                        description:
                          type: string
                          description: Longer description of the parameter
                        unit:
                          type: object
                          required:
                          - symbol
                          properties:
                            label:
                              type: string
                            symbol:
                              type: object
                              required:
                              - type
                              - value
                              properties:
                                type:
                                  type: string
                                  pattern: ^https://qudt\.org/vocab/unit/.*$
                                value:
                                  type: string
                        observedProperty:
                          type: object
                          required:
                          - id
                          - label
                          properties:
                            id:
                              type: string
                              pattern: ^https://vocab\.nerc\.ac\.uk/standard_name/.*$
                            label:
                              type: string
                        measurementType:
                          type: object
                          required:
                          - method
                          - duration
                          properties:
                            method:
                              type: string
                            duration:
                              type: string
                              pattern: ^P(\d+Y)?(\d+M)?(\d+D)?(T(\d+H)?(\d+M)?(\d+S)?)?$
                        metocean:standard_name:
                          type: string
                          description: CF-convention standard name for the parameter
                        metocean:level:
                          type: number
                          description: Height of measurement above ground level in
                            meters
                      additionalProperties: true
                    propertyNames:
                      type: string
                      pattern: ^[a-z][a-z0-9\-]*$
                  extent:
                    type: object
                    required:
                    - spatial
                    properties:
                      spatial:
                        type: object
                        required:
                        - bbox
                        - crs
                        properties:
                          bbox:
                            type: array
                            items:
                              type: array
                              items:
                                type: number
                              minItems: 4
                              maxItems: 6
                          crs:
                            type: string
                            enum:
                            - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                      temporal:
                        type: object
                        properties:
                          interval:
                            type: array
                            items:
                              type: array
                              items:
                                oneOf:
                                - type: string
                                  format: date-time
                                - type: 'null'
                              minItems: 2
                              maxItems: 2
                          values:
                            type: array
                            items:
                              type: string
                          trs:
                            type: string
                            enum:
                            - Gregorian
                      vertical:
                        type: object
                        properties:
                          interval:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          values:
                            type: array
                            items:
                              type: string
                          vrs:
                            type: string
                          positive:
                            type: string
                            enum:
                            - up
                            - down
                            description: Direction in which vertical extent values
                              increase (CF Conventions 'positive' attribute). Disambiguates
                              interval ordering for VRS such as pressure levels.
                      custom:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - interval
                          - reference
                          properties:
                            id:
                              type: string
                            interval:
                              type: array
                              items:
                                type: string
                            values:
                              type: array
                              items:
                                type: string
                            reference:
                              type: string
                  data_queries:
                    type: object
                    description: Available EDR data query types for this collection
                    additionalProperties:
                      type: object
                      properties:
                        link:
                          type: object
                          properties:
                            href:
                              type: string
                            rel:
                              type: string
                            variables:
                              type: object
                              properties:
                                query_type:
                                  type: string
                                output_formats:
                                  type: array
                                  items:
                                    type: string
                                default_output_format:
                                  type: string
                                  description: Default output format for this data
                                    query when f is omitted
                                crs:
                                  type: array
                                  description: CRS values supported by this data query
                                    (shorthand for crs_details)
                                  items:
                                    type: string
                                crs_details:
                                  type: array
                                  description: CRS values supported by this data query
                                  items:
                                    type: object
                                    required:
                                    - crs
                                    properties:
                                      crs:
                                        type: string
                                      wkt:
                                        type: string
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
