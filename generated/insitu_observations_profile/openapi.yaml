  /collections:
    get:
      summary: Collections
      description: Collections
      operationId: getCollections
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: Collections
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - collections
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    example:
                    - href: /collections
                      rel: self
                      type: application/json
                      title: this document
                    - href: /collections?f=html
                      rel: alternate
                      type: text/html
                      title: this document as HTML
                  collections:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - links
                      - extent
                      properties:
                        id:
                          type: string
                          example: insitu-observations
                        title:
                          type: string
                          example: In-situ meteorological observations
                        description:
                          type: string
                          example: Real-time in-situ meteorological observations from
                            surface stations. Provides air temperature, wind, humidity,
                            pressure, precipitation, and dew point at standard measurement
                            heights.
                        keywords:
                          type: array
                          items:
                            type: string
                          example:
                          - meteorology
                          - observations
                          - in-situ
                          - surface
                        links:
                          type: array
                          items:
                            type: object
                            required:
                            - href
                            - rel
                            properties:
                              href:
                                type: string
                              rel:
                                type: string
                              type:
                                type: string
                              title:
                                type: string
                          example:
                          - href: https://example.com/collections/insitu-observations
                            rel: self
                            type: application/json
                          - href: https://creativecommons.org/licenses/by/4.0/
                            rel: license
                            type: text/html
                            title: CC BY 4.0
                        crs:
                          type: array
                          items:
                            type: string
                          example:
                          - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                          - http://www.opengis.net/def/crs/EPSG/0/4326
                          - http://www.opengis.net/def/crs/EPSG/0/3857
                        output_formats:
                          type: array
                          items:
                            type: string
                          example:
                          - CoverageJSON
                          - GeoJSON
                        parameter_names:
                          type: object
                          additionalProperties: false
                          properties:
                            air-temperature-2m-instantaneous:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                label:
                                  type: string
                                  enum:
                                  - Air Temperature at 2m (instantaneous)
                                  default: Air Temperature at 2m (instantaneous)
                                description:
                                  type: string
                                  enum:
                                  - Instantaneous air temperature measured at 2 metres
                                    above ground level
                                  default: Instantaneous air temperature measured
                                    at 2 metres above ground level
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Air Temperature
                                      default: Air Temperature
                                    id:
                                      type: string
                                      enum:
                                      - https://vocab.nerc.ac.uk/standard_name/air_temperature
                                      default: https://vocab.nerc.ac.uk/standard_name/air_temperature
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Kelvin
                                      default: Kelvin
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - K
                                          default: K
                                        type:
                                          type: string
                                          enum:
                                          - https://qudt.org/vocab/unit/K
                                          default: https://qudt.org/vocab/unit/K
                            air-temperature-2m-maximum:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                label:
                                  type: string
                                  enum:
                                  - Air Temperature at 2m (1h maximum)
                                  default: Air Temperature at 2m (1h maximum)
                                description:
                                  type: string
                                  enum:
                                  - Maximum air temperature over the last hour at
                                    2 metres above ground level
                                  default: Maximum air temperature over the last hour
                                    at 2 metres above ground level
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Air Temperature
                                      default: Air Temperature
                                    id:
                                      type: string
                                      enum:
                                      - https://vocab.nerc.ac.uk/standard_name/air_temperature
                                      default: https://vocab.nerc.ac.uk/standard_name/air_temperature
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Kelvin
                                      default: Kelvin
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - K
                                          default: K
                                        type:
                                          type: string
                                          enum:
                                          - https://qudt.org/vocab/unit/K
                                          default: https://qudt.org/vocab/unit/K
                            wind-speed-10m-mean:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                label:
                                  type: string
                                  enum:
                                  - Wind Speed at 10m (10min mean)
                                  default: Wind Speed at 10m (10min mean)
                                description:
                                  type: string
                                  enum:
                                  - Mean wind speed over 10 minutes at 10 metres above
                                    ground level
                                  default: Mean wind speed over 10 minutes at 10 metres
                                    above ground level
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Wind Speed
                                      default: Wind Speed
                                    id:
                                      type: string
                                      enum:
                                      - https://vocab.nerc.ac.uk/standard_name/wind_speed
                                      default: https://vocab.nerc.ac.uk/standard_name/wind_speed
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Metre per Second
                                      default: Metre per Second
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - m/s
                                          default: m/s
                                        type:
                                          type: string
                                          enum:
                                          - https://qudt.org/vocab/unit/M-PER-SEC
                                          default: https://qudt.org/vocab/unit/M-PER-SEC
                            wind-from-direction-10m-mean:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                label:
                                  type: string
                                  enum:
                                  - Wind Direction at 10m (10min mean)
                                  default: Wind Direction at 10m (10min mean)
                                description:
                                  type: string
                                  enum:
                                  - Mean wind direction over 10 minutes at 10 metres
                                    above ground level
                                  default: Mean wind direction over 10 minutes at
                                    10 metres above ground level
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Wind From Direction
                                      default: Wind From Direction
                                    id:
                                      type: string
                                      enum:
                                      - https://vocab.nerc.ac.uk/standard_name/wind_from_direction
                                      default: https://vocab.nerc.ac.uk/standard_name/wind_from_direction
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Degree
                                      default: Degree
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - deg
                                          default: deg
                                        type:
                                          type: string
                                          enum:
                                          - https://qudt.org/vocab/unit/DEG
                                          default: https://qudt.org/vocab/unit/DEG
                            relative-humidity-2m-instantaneous:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                label:
                                  type: string
                                  enum:
                                  - Relative Humidity at 2m (instantaneous)
                                  default: Relative Humidity at 2m (instantaneous)
                                description:
                                  type: string
                                  enum:
                                  - Instantaneous relative humidity at 2 metres above
                                    ground level
                                  default: Instantaneous relative humidity at 2 metres
                                    above ground level
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Relative Humidity
                                      default: Relative Humidity
                                    id:
                                      type: string
                                      enum:
                                      - https://vocab.nerc.ac.uk/standard_name/relative_humidity
                                      default: https://vocab.nerc.ac.uk/standard_name/relative_humidity
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Percent
                                      default: Percent
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - '%'
                                          default: '%'
                                        type:
                                          type: string
                                          enum:
                                          - https://qudt.org/vocab/unit/PERCENT
                                          default: https://qudt.org/vocab/unit/PERCENT
                            air-pressure-at-sea-level-instantaneous:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                label:
                                  type: string
                                  enum:
                                  - Air Pressure at Sea Level (instantaneous)
                                  default: Air Pressure at Sea Level (instantaneous)
                                description:
                                  type: string
                                  enum:
                                  - Instantaneous air pressure reduced to mean sea
                                    level
                                  default: Instantaneous air pressure reduced to mean
                                    sea level
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Air Pressure at Mean Sea Level
                                      default: Air Pressure at Mean Sea Level
                                    id:
                                      type: string
                                      enum:
                                      - https://vocab.nerc.ac.uk/standard_name/air_pressure_at_mean_sea_level
                                      default: https://vocab.nerc.ac.uk/standard_name/air_pressure_at_mean_sea_level
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Pascal
                                      default: Pascal
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - Pa
                                          default: Pa
                                        type:
                                          type: string
                                          enum:
                                          - https://qudt.org/vocab/unit/PA
                                          default: https://qudt.org/vocab/unit/PA
                            precipitation-amount-1h-sum:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                label:
                                  type: string
                                  enum:
                                  - Precipitation Amount (1h sum)
                                  default: Precipitation Amount (1h sum)
                                description:
                                  type: string
                                  enum:
                                  - Total precipitation amount accumulated over the
                                    last hour
                                  default: Total precipitation amount accumulated
                                    over the last hour
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Precipitation Amount
                                      default: Precipitation Amount
                                    id:
                                      type: string
                                      enum:
                                      - https://vocab.nerc.ac.uk/standard_name/precipitation_amount
                                      default: https://vocab.nerc.ac.uk/standard_name/precipitation_amount
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Kilogram per Square Metre
                                      default: Kilogram per Square Metre
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - kg/m2
                                          default: kg/m2
                                        type:
                                          type: string
                                          enum:
                                          - https://qudt.org/vocab/unit/KiloGM-PER-M2
                                          default: https://qudt.org/vocab/unit/KiloGM-PER-M2
                            dew-point-temperature-2m-instantaneous:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                label:
                                  type: string
                                  enum:
                                  - Dew Point Temperature at 2m (instantaneous)
                                  default: Dew Point Temperature at 2m (instantaneous)
                                description:
                                  type: string
                                  enum:
                                  - Instantaneous dew point temperature at 2 metres
                                    above ground level
                                  default: Instantaneous dew point temperature at
