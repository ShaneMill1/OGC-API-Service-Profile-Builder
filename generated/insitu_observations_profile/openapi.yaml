        in: query
        required: false
        description: 'Comma-separated list of parameters to retrieve. Parameters of
          this collection:

          - `air-temperature-2m-instantaneous` (unit Kelvin; symbol K)

          - `air-temperature-2m-maximum` (unit Kelvin; symbol K)

          - `wind-speed-10m-mean` (unit Metre per Second; symbol m/s)

          - `wind-from-direction-10m-mean` (unit Degree; symbol deg)

          - `relative-humidity-2m-instantaneous` (unit Percent; symbol %)

          - `air-pressure-at-sea-level-instantaneous` (unit Pascal; symbol Pa)

          - `precipitation-amount-1h-sum` (unit Kilogram per Square Metre; symbol
          kg/m2)

          - `dew-point-temperature-2m-instantaneous` (unit Kelvin; symbol K)'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - air-temperature-2m-instantaneous
            - air-temperature-2m-maximum
            - wind-speed-10m-mean
