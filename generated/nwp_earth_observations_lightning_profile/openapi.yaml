openapi: 3.1.0
info:
  title: DGIWG NWP Earth Observations Lightning Profile
  version: '1.0'
  description: 'Service profile for NWP Earth Observations Lightning data, providing
    frequency of lightning flashes per unit area via OGC API - EDR. Supports cube,
    radius, and items queries with GET and POST.

    '
  x-ogc-profile: https://schemas.dgiwg.org/edr/1.0/req/nwp_earth_observations_lightning
  x-keywords:
  - cube
  - radius
  - items
  - datetime
  - frequency_of_lightning_flashes_per_unit_area
  - lightning flashes
  - lightning
  contact:
    name: Guy Collins
    x-organization: Met Office
servers:
- url: /
  description: Placeholder server URL. Per OGC API - EDR Part 3 REQ_publishing, this
    profile document is implementation-independent. Implementations SHALL substitute
    their own server URL.
tags:
- name: server
  description: DGIWG NWP Earth Observations Lightning Profile
- name: earth_observations_lightning
  description: NWP Earth Observations Lightning data providing frequency of lightning
    flashes per unit area. Supports cube, radius, and items queries. Datetime values
    use RFC 3339 format in Zulu Gregorian time (e.g. 2026-04-12T21:20:50Z).
paths:
  /:
    get:
      summary: Landing page
      description: Landing page
      operationId: getLandingPage
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    contains:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        rel:
                          const: profile
                        href:
                          const: https://schemas.dgiwg.org/edr/1.0/req/nwp_earth_observations_lightning
                  title:
                    type: string
                    const: DGIWG NWP Earth Observations Lightning Profile
                  description:
                    type: string
                  keywords:
                    type: array
                    items:
                      type: string
                    contains:
                      enum:
                      - cube
                      - radius
                      - items
                      - datetime
                      - frequency_of_lightning_flashes_per_unit_area
                      - lightning flashes
                      - lightning
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
  /conformance:
    get:
      summary: API conformance definition
      description: API conformance definition
      operationId: getConformanceDeclaration
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Conformance classes
          content:
            application/json:
              schema:
                type: object
                required:
                - conformsTo
                properties:
                  conformsTo:
                    type: array
                    items:
                      type: string
                    contains:
                      enum:
                      - http://www.opengis.net/spec/ogcapi-common-1/1.0/conf/core
                      - http://www.opengis.net/spec/ogcapi-common-2/1.0/conf/collections
                      - http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/core
                      - http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/oas30
                      - http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/html
