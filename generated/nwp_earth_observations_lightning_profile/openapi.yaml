  /collections:
    get:
      summary: Collections
      description: Collections
      operationId: getCollections
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: Collections
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - collections
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    example:
                    - href: /collections
                      rel: self
                      type: application/json
                      title: this document
                    - href: /collections?f=html
                      rel: alternate
                      type: text/html
                      title: this document as HTML
                  collections:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - links
                      - extent
                      properties:
                        id:
                          type: string
                          example: earth_observations_lightning
                        title:
                          type: string
                          example: Earth Observations Lightning Strikes
                        description:
                          type: string
                          example: NWP Earth Observations Lightning data providing
                            frequency of lightning flashes per unit area. Supports
                            cube, radius, and items queries. Datetime values use RFC
                            3339 format in Zulu Gregorian time (e.g. 2026-04-12T21:20:50Z).
                        keywords:
                          type: array
                          items:
                            type: string
                          example:
                          - lightning
                          - NWP
                          - earth observations
                          - DGIWG
                        links:
                          type: array
                          items:
                            type: object
                            required:
                            - href
                            - rel
                            properties:
                              href:
                                type: string
                              rel:
                                type: string
                              type:
                                type: string
                              title:
                                type: string
                          example:
                          - href: https://example.com/collections/earth_observations_lightning
                            rel: self
                            type: application/json
                            title: Earth observations lightning strikes
                          - href: https://example.com/collections/earth_observations_lightning
                            rel: alternate
                            type: text/html
                            title: Earth observations lightning strikes
                          - href: https://example.com/terms_resource_use_limitation.html
                            rel: terms_of_service
                            type: text/html
                            title: Resource Use Limitation
                        crs:
                          type: array
                          items:
                            type: string
                          example:
                          - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                          - https://epsg.org/crs_4326/WGS-84.html
                          - https://epsg.org/crs_25832/ETRS89-UTM-zone-32N.html
                        output_formats:
                          type: array
                          items:
                            type: string
                          example:
                          - GeoJSON
                          - CoverageJSON
                        parameter_names:
                          type: object
                          additionalProperties: false
                          properties:
                            frequency_of_lightning_flashes_per_unit_area:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                description:
                                  type: string
                                  enum:
                                  - Number of occurrences of a lightning flash event
                                    per unit area per unit time.
                                  default: Number of occurrences of a lightning flash
                                    event per unit area per unit time.
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Frequency of Lightning Flashes per Unit Area
                                      default: Frequency of Lightning Flashes per
                                        Unit Area
                                    id:
                                      type: string
                                      enum:
                                      - https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html
                                      default: https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - 'Number of lightning flash events per unit
                                        area per unit time: per square metre per second.'
                                      default: 'Number of lightning flash events per
                                        unit area per unit time: per square metre
                                        per second.'
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - m-2 s-1
                                          default: m-2 s-1
                                        type:
                                          type: string
                                          enum:
                                          - https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html
                                          default: https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html
                        extent:
                          type: object
                          required:
                          - spatial
                          properties:
                            spatial:
                              type: object
                              required:
                              - bbox
                              - crs
                              properties:
                                bbox:
                                  type: array
                                  items:
                                    type: array
                                    items:
                                      type: number
                                  example:
                                  - - -180.0
                                    - -90.0
                                    - 180.0
                                    - 90.0
                                crs:
                                  type: string
                                  example: http://www.opengis.net/def/crs/OGC/1.3/CRS84
                            temporal:
                              type: object
                              required:
                              - trs
                              properties:
                                trs:
                                  type: string
                                  example: http://www.opengis.net/def/uom/ISO-8601/0/Gregorian
                                interval:
                                  type: array
                                  items:
                                    type: array
                                    items:
                                      type: string
                                      nullable: true
                                  example:
                                  - - 2020-01-01 00:00:00+00:00
                                    - null
                                values:
                                  type: array
                                  items:
                                    type: string
                                  example:
                                  - 2020-01-01T00:00:00Z/..
                        data_queries:
                          type: object
                          properties:
                            radius:
                              type: object
                              properties:
                                link:
                                  type: object
                                  properties:
                                    href:
                                      type: string
                                      example: https://example.com/collections/earth_observations_lightning/radius
                                    rel:
                                      type: string
                                      example: data
                                    variables:
                                      type: object
                                      properties:
                                        query_type:
                                          type: string
                                          example: radius
                                        output_formats:
                                          type: array
                                          items:
                                            type: string
                                          example:
                                          - CoverageJSON
                            cube:
                              type: object
                              properties:
                                link:
                                  type: object
                                  properties:
                                    href:
                                      type: string
                                      example: https://example.com/collections/earth_observations_lightning/cube
                                    rel:
                                      type: string
                                      example: data
                                    variables:
                                      type: object
                                      properties:
                                        query_type:
                                          type: string
                                          example: cube
                                        output_formats:
                                          type: array
                                          items:
                                            type: string
                                          example:
                                          - CoverageJSON
                            items:
                              type: object
                              properties:
                                link:
                                  type: object
                                  properties:
                                    href:
                                      type: string
                                      example: https://example.com/collections/earth_observations_lightning/items
                                    rel:
                                      type: string
                                      example: data
                                    variables:
                                      type: object
                                      properties:
                                        query_type:
                                          type: string
                                          example: items
                                        output_formats:
                                          type: array
                                          items:
                                            type: string
                                          example:
                                          - GeoJSON
                          additionalProperties: false
                        metadata_date:
                          type: string
                          example: '2026-07-16'
                        resource_service_publish_date:
                          type: string
                          example: '2026-07-16'
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
