  /collections/earth_observations_lightning:
    get:
      summary: Get Earth Observations Lightning Strikes metadata
      description: NWP Earth Observations Lightning data providing frequency of lightning
        flashes per unit area. Supports cube, radius, and items queries. Datetime
        values use RFC 3339 format in Zulu Gregorian time (e.g. 2026-04-12T21:20:50Z).
      operationId: DescribeEarthObservationsLightningCollection
      tags:
      - earth_observations_lightning
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Collection metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - links
                - extent
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  keywords:
                    type: array
                    items:
                      type: string
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                  crs:
                    type: array
                    items:
                      type: string
                      enum:
                      - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                      - https://epsg.org/crs_4326/WGS-84.html
                      - https://epsg.org/crs_25832/ETRS89-UTM-zone-32N.html
                  output_formats:
                    type: array
                    items:
                      type: string
                      enum:
                      - GeoJSON
                      - CoverageJSON
                  parameter_names:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                      - type
                      - observedProperty
                      properties:
                        type:
                          type: string
                          const: Parameter
                        id:
                          type: string
                        label:
                          type: string
                        description:
                          type: string
                        data-type:
                          type: string
                          enum:
                          - integer
                          - float
                          - string
                        unit:
                          type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            symbol:
                              oneOf:
                              - type: string
                              - type: object
                                required:
                                - value
                                - type
                                properties:
                                  value:
                                    type: string
                                  type:
                                    type: string
                        observedProperty:
                          type: object
                          required:
                          - label
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            description:
                              type: string
                        measurementType:
                          type: object
                          required:
                          - method
                          - duration
                          properties:
                            method:
                              type: string
                            duration:
                              type: string
                        extent:
                          type: object
                      additionalProperties: true
                  extent:
                    type: object
                    required:
                    - spatial
                    properties:
                      spatial:
                        type: object
                        required:
                        - bbox
                        - crs
                        properties:
                          bbox:
                            type: array
                            items:
                              type: array
                              items:
                                type: number
                              minItems: 4
                              maxItems: 6
                          crs:
                            type: string
                            enum:
                            - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                      temporal:
                        type: object
                        properties:
                          interval:
                            type: array
                            items:
                              type: array
                              items:
                                oneOf:
                                - type: string
                                  format: date-time
                                - type: 'null'
                              minItems: 2
                              maxItems: 2
                          values:
                            type: array
                            items:
                              type: string
                          trs:
                            type: string
                            enum:
                            - http://www.opengis.net/def/uom/ISO-8601/0/Gregorian
                      vertical:
                        type: object
                        properties:
                          interval:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          values:
                            type: array
                            items:
                              type: string
                          vrs:
                            type: string
                          positive:
                            type: string
                            enum:
                            - up
                            - down
                            description: Direction in which vertical extent values
                              increase (CF Conventions 'positive' attribute). Disambiguates
                              interval ordering for VRS such as pressure levels.
                      custom:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - interval
                          - reference
                          properties:
                            id:
                              type: string
                            interval:
                              type: array
                              items:
                                type: string
                            values:
                              type: array
                              items:
                                type: string
                            reference:
                              type: string
                  data_queries:
                    type: object
                    description: Available EDR data query types for this collection
                    additionalProperties:
                      type: object
                      properties:
                        link:
                          type: object
                          properties:
                            href:
                              type: string
                            rel:
                              type: string
                            variables:
                              type: object
                              properties:
                                query_type:
                                  type: string
                                output_formats:
                                  type: array
                                  items:
                                    type: string
                                default_output_format:
                                  type: string
                                  description: Default output format for this data
                                    query when f is omitted
                                crs:
                                  type: array
                                  description: CRS values supported by this data query
                                    (shorthand for crs_details)
                                  items:
                                    type: string
                                crs_details:
                                  type: array
                                  description: CRS values supported by this data query
                                  items:
                                    type: object
                                    required:
                                    - crs
                                    properties:
                                      crs:
                                        type: string
                                        enum:
                                        - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                                        - https://epsg.org/crs_4326/WGS-84.html
                                        - https://epsg.org/crs_25832/ETRS89-UTM-zone-32N.html
                                      wkt:
                                        type: string
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
