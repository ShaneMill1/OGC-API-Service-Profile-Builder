          this collection:

          - `gh` (unit Geopotential metre; symbol gpm)

          - `t` (unit Kelvin; symbol K)

          - `u` (unit Metre per Second; symbol m/s)

          - `v` (unit Metre per Second; symbol m/s)

          - `r` (unit Percent; symbol %)

          - `msl` (unit Pascal; symbol Pa)

          - `2t` (unit Kelvin; symbol K)

          - `mn2t3` (unit Kelvin; symbol K)

          - `mx2t3` (unit Kelvin; symbol K)

          - `mn2t6` (unit Kelvin; symbol K)

          - `mx2t6` (unit Kelvin; symbol K)

          - `2d` (unit Kelvin; symbol K)

          - `10u` (unit Metre per Second; symbol m/s)

          - `10v` (unit Metre per Second; symbol m/s)

          - `10fg` (unit Metre per Second; symbol m/s)

          - `tp` (unit Metre; symbol m)

          - `cape` (unit Joule per Kilogram; symbol J/kg)

          - `tcw` (unit Kilogram per Square Metre; symbol kg/m2)

          - `tcc` (unit Dimensionless; symbol 1)'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - gh
            - t
            - u
            - v
            - r
            - msl
