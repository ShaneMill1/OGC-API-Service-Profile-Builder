  /collections/weather_forecast:
    get:
      summary: Get Global deterministic NWP model forecast metadata
      description: Global deterministic Numerical Weather Prediction output. Each
        model run is exposed as an EDR instance (/instances/{instanceId}) identified
        by an RFC3339 datestamp; a data query with no instance targets the latest
        run.
      operationId: DescribeWeatherForecastCollection
      tags:
      - weather_forecast
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Collection metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - links
                - extent
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  keywords:
                    type: array
                    items:
                      type: string
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                  crs:
                    type: array
                    items:
                      type: string
                      enum:
                      - OGC:CRS84
                  output_formats:
                    type: array
                    items:
                      type: string
                      enum:
                      - CoverageJSON
                  parameter_names:
                    type: object
                    additionalProperties:
                      type: object
                      title: NWP parameter
                      required:
                      - type
                      - id
                      - label
                      - description
                      - unit
                      - observedProperty
                      properties:
                        type:
                          type: string
                          enum:
                          - Parameter
                        id:
                          type: string
                          description: ECMWF short name from Annex D
                        label:
                          type: string
                          description: Human-readable parameter name (max 50 characters,
                            English)
                        description:
                          type: string
                          description: Parameter name as listed in Annex D
                        unit:
                          type: object
                          required:
                          - symbol
                          properties:
                            label:
                              type: string
                            symbol:
                              type: object
                              required:
                              - type
                              - value
                              properties:
                                type:
                                  type: string
                                  pattern: ^https://qudt\.org/vocab/unit/.*$
                                value:
                                  type: string
                        observedProperty:
                          type: object
                          required:
                          - id
                          - label
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                      additionalProperties: true
                    propertyNames:
                      type: string
                      pattern: ^[a-z0-9][a-z0-9\-]*$
                  extent:
                    type: object
                    required:
                    - spatial
                    properties:
                      spatial:
                        type: object
                        required:
                        - bbox
                        - crs
                        properties:
                          bbox:
                            type: array
                            items:
                              type: array
                              items:
                                type: number
                              minItems: 4
                              maxItems: 6
                          crs:
                            type: string
                            enum:
                            - OGC:CRS84
                      temporal:
                        type: object
                        properties:
                          interval:
                            type: array
                            items:
                              type: array
                              items:
                                oneOf:
                                - type: string
                                  format: date-time
                                - type: 'null'
                              minItems: 2
                              maxItems: 2
                          values:
                            type: array
                            items:
                              type: string
                          trs:
                            type: string
                            enum:
                            - Gregorian
                      vertical:
                        type: object
                        properties:
                          interval:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          values:
                            type: array
                            items:
                              type: string
                          vrs:
                            type: string
                          positive:
                            type: string
                            enum:
                            - up
                            - down
                            description: Direction in which vertical extent values
                              increase (CF Conventions 'positive' attribute). Disambiguates
                              interval ordering for VRS such as pressure levels.
                      custom:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - interval
                          - reference
                          properties:
                            id:
                              type: string
                            interval:
                              type: array
                              items:
                                type: string
                            values:
                              type: array
                              items:
                                type: string
                            reference:
                              type: string
                  data_queries:
                    type: object
                    description: Available EDR data query types for this collection
                    additionalProperties:
                      type: object
                      properties:
                        link:
                          type: object
                          properties:
                            href:
                              type: string
                            rel:
                              type: string
                            variables:
                              type: object
                              properties:
                                query_type:
                                  type: string
                                output_formats:
                                  type: array
                                  items:
                                    type: string
                                default_output_format:
                                  type: string
                                  description: Default output format for this data
                                    query when f is omitted
                                crs:
                                  type: array
                                  description: CRS values supported by this data query
                                    (shorthand for crs_details)
                                  items:
                                    type: string
                                crs_details:
                                  type: array
                                  description: CRS values supported by this data query
                                  items:
                                    type: object
                                    required:
                                    - crs
                                    properties:
                                      crs:
                                        type: string
                                      wkt:
                                        type: string
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
