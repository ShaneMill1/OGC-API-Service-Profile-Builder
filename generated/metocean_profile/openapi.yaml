                      - http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/conf/core
                      - http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/conf/insitu-observations
                      - http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/conf/nwp
                      - http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/conf/data-query-response-format
                    default:
                    - http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/core
                    - http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/collections
                    - http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/conf/core
                    - http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/conf/insitu-observations
                    - http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/conf/nwp
                    - http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/conf/data-query-response-format
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
  /collections:
    get:
      summary: Collections
      description: Collections
      operationId: getCollections
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: Collections
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - collections
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    example:
                    - href: /collections
                      rel: self
                      type: application/json
                      title: this document
                    - href: /collections?f=html
                      rel: alternate
                      type: text/html
                      title: this document as HTML
                  collections:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        required:
                        - id
                        - links
                        - extent
                        properties:
                          id:
                            type: string
                            example: insitu-observations
                          title:
                            type: string
                            example: In-situ meteorological observations
                          description:
                            type: string
                            example: Real-time in-situ meteorological surface observations
                              (air temperature, wind, humidity, pressure) from land
                              stations.
                          keywords:
                            type: array
                            items:
                              type: string
                            example:
                            - meteorology
                            - observations
                            - in-situ
                          links:
                            type: array
                            items:
                              type: object
                              required:
                              - href
                              - rel
                              properties:
                                href:
                                  type: string
                                rel:
                                  type: string
                                type:
                                  type: string
                                title:
                                  type: string
                            example:
                            - href: https://example.com/collections/insitu-observations
                              rel: self
                              type: application/json
                            - href: https://creativecommons.org/licenses/by/4.0/
                              rel: license
                              type: text/html
                              title: CC BY 4.0
                          crs:
                            type: array
                            items:
                              type: string
                            example:
                            - OGC:CRS84
                          output_formats:
                            type: array
                            items:
                              type: string
                            example:
                            - CoverageJSON
                            - GeoJSON
                          parameter_names:
                            type: object
                            additionalProperties: false
                            properties:
                              air-temperature-2m-instantaneous:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  label:
                                    type: string
                                    enum:
                                    - Air Temperature at 2m (instantaneous)
                                    default: Air Temperature at 2m (instantaneous)
                                  description:
                                    type: string
                                    enum:
                                    - Instantaneous air temperature at 2 metres above
                                      ground level
                                    default: Instantaneous air temperature at 2 metres
                                      above ground level
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Air Temperature
                                        default: Air Temperature
                                      id:
                                        type: string
                                        enum:
                                        - https://vocab.nerc.ac.uk/standard_name/air_temperature
                                        default: https://vocab.nerc.ac.uk/standard_name/air_temperature
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Kelvin
                                        default: Kelvin
                                      symbol:
                                        type: object
                                        required:
                                        - value
                                        - type
                                        properties:
                                          value:
                                            type: string
                                            enum:
                                            - K
                                            default: K
                                          type:
                                            type: string
                                            enum:
                                            - https://qudt.org/vocab/unit/K
                                            default: https://qudt.org/vocab/unit/K
                              wind-speed-10m-mean:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  label:
                                    type: string
                                    enum:
                                    - Wind Speed at 10m (10min mean)
                                    default: Wind Speed at 10m (10min mean)
                                  description:
                                    type: string
                                    enum:
                                    - Mean wind speed over 10 minutes at 10 metres
                                      above ground level
                                    default: Mean wind speed over 10 minutes at 10
                                      metres above ground level
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Wind Speed
                                        default: Wind Speed
                                      id:
                                        type: string
                                        enum:
                                        - https://vocab.nerc.ac.uk/standard_name/wind_speed
                                        default: https://vocab.nerc.ac.uk/standard_name/wind_speed
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Metre per Second
                                        default: Metre per Second
                                      symbol:
                                        type: object
                                        required:
                                        - value
                                        - type
                                        properties:
                                          value:
                                            type: string
                                            enum:
                                            - m/s
                                            default: m/s
                                          type:
                                            type: string
                                            enum:
                                            - https://qudt.org/vocab/unit/M-PER-SEC
                                            default: https://qudt.org/vocab/unit/M-PER-SEC
                              wind-from-direction-10m-mean:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  label:
                                    type: string
                                    enum:
                                    - Wind Direction at 10m (10min mean)
                                    default: Wind Direction at 10m (10min mean)
                                  description:
                                    type: string
                                    enum:
                                    - Mean wind direction over 10 minutes at 10 metres
                                      above ground level
                                    default: Mean wind direction over 10 minutes at
                                      10 metres above ground level
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Wind From Direction
                                        default: Wind From Direction
                                      id:
                                        type: string
                                        enum:
                                        - https://vocab.nerc.ac.uk/standard_name/wind_from_direction
                                        default: https://vocab.nerc.ac.uk/standard_name/wind_from_direction
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Degree
                                        default: Degree
                                      symbol:
                                        type: object
                                        required:
                                        - value
                                        - type
                                        properties:
                                          value:
                                            type: string
                                            enum:
                                            - deg
                                            default: deg
                                          type:
                                            type: string
                                            enum:
                                            - https://qudt.org/vocab/unit/DEG
                                            default: https://qudt.org/vocab/unit/DEG
                              relative-humidity-2m-instantaneous:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  label:
                                    type: string
                                    enum:
                                    - Relative Humidity at 2m (instantaneous)
                                    default: Relative Humidity at 2m (instantaneous)
                                  description:
                                    type: string
                                    enum:
                                    - Instantaneous relative humidity at 2 metres
                                      above ground level
                                    default: Instantaneous relative humidity at 2
                                      metres above ground level
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Relative Humidity
                                        default: Relative Humidity
                                      id:
                                        type: string
                                        enum:
                                        - https://vocab.nerc.ac.uk/standard_name/relative_humidity
                                        default: https://vocab.nerc.ac.uk/standard_name/relative_humidity
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Percent
                                        default: Percent
                                      symbol:
                                        type: object
                                        required:
                                        - value
                                        - type
                                        properties:
                                          value:
                                            type: string
                                            enum:
                                            - '%'
                                            default: '%'
                                          type:
                                            type: string
                                            enum:
                                            - https://qudt.org/vocab/unit/PERCENT
                                            default: https://qudt.org/vocab/unit/PERCENT
                              air-pressure-at-sea-level-instantaneous:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  label:
                                    type: string
                                    enum:
                                    - Air Pressure at Sea Level (instantaneous)
                                    default: Air Pressure at Sea Level (instantaneous)
                                  description:
                                    type: string
                                    enum:
                                    - Instantaneous air pressure reduced to mean sea
                                      level
                                    default: Instantaneous air pressure reduced to
                                      mean sea level
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Air Pressure at Mean Sea Level
                                        default: Air Pressure at Mean Sea Level
                                      id:
                                        type: string
                                        enum:
                                        - https://vocab.nerc.ac.uk/standard_name/air_pressure_at_mean_sea_level
                                        default: https://vocab.nerc.ac.uk/standard_name/air_pressure_at_mean_sea_level
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Pascal
                                        default: Pascal
                                      symbol:
                                        type: object
                                        required:
                                        - value
                                        - type
                                        properties:
                                          value:
                                            type: string
                                            enum:
                                            - Pa
                                            default: Pa
                                          type:
                                            type: string
                                            enum:
                                            - https://qudt.org/vocab/unit/PA
                                            default: https://qudt.org/vocab/unit/PA
                          extent:
                            type: object
                            required:
                            - spatial
                            properties:
                              spatial:
                                type: object
                                required:
                                - bbox
                                - crs
                                properties:
                                  bbox:
                                    type: array
                                    items:
                                      type: array
                                      items:
                                        type: number
                                    example:
                                    - - -180.0
                                      - -90.0
                                      - 180.0
                                      - 90.0
                                  crs:
                                    type: string
                                    example: OGC:CRS84
                              temporal:
                                type: object
                                required:
                                - trs
                                properties:
                                  trs:
                                    type: string
                                    example: Gregorian
                                  interval:
                                    type: array
                                    items:
                                      type: array
                                      items:
                                        type: string
                                        nullable: true
                                    example:
                                    - - 2020-01-01 00:00:00+00:00
                                      - null
                                  values:
                                    type: array
                                    items:
                                      type: string
                                    example:
                                    - 2020-01-01T00:00:00Z/..
                              custom:
                                type: array
                                items:
                                  oneOf:
                                  - type: object
                                    required:
                                    - id
                                    - interval
                                    - reference
                                    properties:
                                      id:
                                        type: string
                                        example: standard_name
                                      interval:
                                        type: array
                                        items:
                                          type: string
                                        example: []
                                      reference:
                                        type: string
                                        example: https://vocab.nerc.ac.uk/standard_name/
                                  - type: object
                                    required:
                                    - id
                                    - interval
                                    - reference
                                    properties:
                                      id:
                                        type: string
                                        example: level
                                      interval:
                                        type: array
                                        items:
                                          type: string
                                        example: []
                                      reference:
                                        type: string
                                        example: Height of measurement above ground
                                          level in meters
                          data_queries:
                            type: object
                            properties:
                              radius:
                                type: object
                                properties:
                                  link:
                                    type: object
                                    properties:
                                      href:
                                        type: string
                                        example: https://example.com/collections/insitu-observations/radius
                                      rel:
                                        type: string
                                        example: data
                                      variables:
                                        type: object
                                        properties:
                                          query_type:
                                            type: string
                                            example: radius
                                          output_formats:
                                            type: array
                                            items:
                                              type: string
                                            example:
                                            - CoverageJSON
                              area:
                                type: object
                                properties:
                                  link:
                                    type: object
                                    properties:
                                      href:
                                        type: string
                                        example: https://example.com/collections/insitu-observations/area
                                      rel:
                                        type: string
                                        example: data
                                      variables:
                                        type: object
                                        properties:
                                          query_type:
                                            type: string
                                            example: area
                                          output_formats:
                                            type: array
                                            items:
                                              type: string
                                            example:
                                            - CoverageJSON
                              locations:
                                type: object
                                properties:
                                  link:
                                    type: object
                                    properties:
                                      href:
                                        type: string
                                        example: https://example.com/collections/insitu-observations/locations
                                      rel:
                                        type: string
                                        example: data
                                      variables:
                                        type: object
                                        properties:
                                          query_type:
                                            type: string
                                            example: locations
                                          output_formats:
                                            type: array
                                            items:
                                              type: string
                                            example:
                                            - CoverageJSON
                                            - GeoJSON
                            additionalProperties: false
                      - type: object
                        required:
                        - id
                        - links
                        - extent
                        properties:
                          id:
                            type: string
                            example: weather_forecast
                          title:
                            type: string
                            example: Global deterministic NWP model forecast
                          description:
                            type: string
                            example: Global deterministic Numerical Weather Prediction
                              output. Each model run is exposed as an EDR instance
                              (/instances/{instanceId}) identified by an RFC3339 datestamp;
                              a data query with no instance targets the latest run.
                          keywords:
                            type: array
                            items:
                              type: string
                            example:
                            - NWP
                            - forecast
                            - global deterministic
                          links:
                            type: array
                            items:
                              type: object
                              required:
                              - href
                              - rel
                              properties:
                                href:
                                  type: string
                                rel:
                                  type: string
                                type:
                                  type: string
                                title:
                                  type: string
                            example:
                            - href: https://example.com/collections/weather_forecast
                              rel: self
                              type: application/json
                            - href: https://creativecommons.org/licenses/by/4.0/
                              rel: license
                              type: text/html
                              title: CC BY 4.0
                          crs:
                            type: array
                            items:
                              type: string
                            example:
                            - OGC:CRS84
                          output_formats:
                            type: array
                            items:
                              type: string
                            example:
                            - CoverageJSON
                          parameter_names:
                            type: object
                            additionalProperties: false
                            properties:
                              gh:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  id:
                                    type: string
                                    enum:
                                    - gh
                                    default: gh
                                  label:
                                    type: string
                                    enum:
                                    - Geopotential Height
                                    default: Geopotential Height
                                  description:
                                    type: string
                                    enum:
                                    - Geopotential Height
                                    default: Geopotential Height
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Geopotential Height
                                        default: Geopotential Height
                                      id:
