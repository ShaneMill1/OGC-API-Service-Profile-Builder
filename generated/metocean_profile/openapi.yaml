          minLon,minLat,maxLon,maxLat (optionally with min/max height).'
        schema:
          type: array
          minItems: 4
          maxItems: 6
          items:
            type: number
      - $ref: https://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/ogcapi-features-1.yaml#/components/parameters/datetime
      - name: parameter-name
        in: query
