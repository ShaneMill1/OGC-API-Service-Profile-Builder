  /collections/insitu-observations/radius:
    get:
      summary: query insitu-observations by radius
      description: Real-time in-situ meteorological surface observations (air temperature,
        wind, humidity, pressure) from land stations.
      operationId: QueryRadiusInsituObservations
      tags:
      - insitu-observations
      parameters:
      - $ref: https://schemas.opengis.net/ogcapi/edr/1.0/openapi/parameters/positionCoords.yaml
      - $ref: https://schemas.opengis.net/ogcapi/edr/1.0/openapi/parameters/within.yaml
      - name: within-units
        in: query
        required: true
        description: Units for the within parameter e.g. km
        schema:
          type: string
      - $ref: https://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/ogcapi-features-1.yaml#/components/parameters/datetime
      - $ref: https://schemas.opengis.net/ogcapi/edr/1.0/openapi/parameters/parameter-name.yaml
      - $ref: https://schemas.opengis.net/ogcapi/edr/1.0/openapi/parameters/z.yaml
      - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: Coverage data response
          content:
            application/prs.coverage+json:
              schema:
                $ref: https://schemas.opengis.net/covjson/1.0/coveragejson.json
            application/vnd.cov+json:
              schema:
                $ref: https://schemas.opengis.net/covjson/1.0/coveragejson.json
            application/geo+json:
              schema:
