openapi: 3.0.0
info:
  title: MetOcean Profile for OGC API - Environmental Data Retrieval
  version: '1.0'
  description: 'An EDR profile in support of providing access to meteorological datasets
    in the MetOcean community of practice, covering in-situ observations and Numerical
    Weather Prediction output. Profile of OGC API - EDR Part 1: Core.'
  x-ogc-profile: http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/req/metocean_profile
  x-keywords:
  - metocean
  - ogc
  - api
  - edr
  - weather
  - meteorology
  - high value datasets
  contact:
    name: Håvard Futsæter
    x-organization: Norwegian Meteorological Institute
servers:
- url: /
  description: Placeholder server URL. Per OGC API - EDR Part 3 REQ_publishing, this
    profile document is implementation-independent. Implementations SHALL substitute
    their own server URL.
tags:
- name: server
  description: MetOcean Profile for OGC API - Environmental Data Retrieval
- name: insitu-observations
  description: Real-time in-situ meteorological surface observations (air temperature,
    wind, humidity, pressure) from land stations.
- name: weather_forecast
  description: Global deterministic Numerical Weather Prediction output. Each model
    run is exposed as an EDR instance (/instances/{instanceId}) identified by an RFC3339
    datestamp; a data query with no instance targets the latest run.
paths:
  /:
    get:
      summary: Landing page
      description: Landing page
      operationId: getLandingPage
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                          enum:
                          - self
                          - service-desc
                          - service-doc
                          - conformance
                          - data
                          - profile
                        type:
                          type: string
                        title:
                          type: string
                        hreflang:
                          type: string
                    example:
                    - href: /
                      rel: self
                      type: application/json
                      title: this document
                    - href: /api
                      rel: service-desc
                      type: application/vnd.oai.openapi+json;version=3.0.0
                      title: the API definition
                    - href: /api.html
                      rel: service-doc
                      type: text/html
                      title: the API documentation
                    - href: /conformance
                      rel: conformance
                      type: application/json
                      title: OGC API conformance classes implemented by this server
                    - href: /collections
                      rel: data
                      type: application/json
                      title: Information about the collections
                    - href: http://www.opengis.net/spec/profile/metocean-ogcapi-environmental-data-retrieval/1.0/req/metocean_profile
                      rel: profile
                      type: application/yaml
                      title: OpenAPI Specification Profile for metocean_profile
                  title:
                    type: string
                    example: MetOcean Profile for OGC API - Environmental Data Retrieval
                  version:
                    type: string
                    example: '1.0'
                  description:
                    type: string
                    example: 'An EDR profile in support of providing access to meteorological
                      datasets in the MetOcean community of practice, covering in-situ
                      observations and Numerical Weather Prediction output. Profile
                      of OGC API - EDR Part 1: Core.'
                  keywords:
                    type: array
                    items:
                      type: string
                    example:
                    - metocean
                    - ogc
                    - api
                    - edr
                    - weather
                    - meteorology
                    - high value datasets
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
