  /collections/weather_forecast/items/{featureId}:
    get:
      summary: Get Global deterministic NWP model forecast item by id
      description: Global deterministic Numerical Weather Prediction output. Each
        model run is exposed as an EDR instance (/instances/{instanceId}) identified
        by an RFC3339 datestamp; a data query with no instance targets the latest
        run.
      operationId: GetWeatherForecastFeature
      tags:
      - weather_forecast
      parameters:
      - name: featureId
        in: path
        required: true
        description: Feature identifier
        schema:
          type: string
      - name: crs
        in: query
        required: false
        description: 'Identifier of the coordinate reference system for the response.
          Supported for this collection: OGC:CRS84.'
        schema:
          type: string
          enum:
          - OGC:CRS84
          default: OGC:CRS84
      - name: f
        in: query
        required: false
        description: 'The optional f parameter indicates the output format which the
          server shall provide as part of the response document. Formats for this
          feature: CoverageJSON. Default: CoverageJSON.'
        schema:
          type: string
          enum:
          - CoverageJSON
          default: CoverageJSON
        style: form
        explode: false
      responses:
        '200':
          description: CoverageJSON feature response
