  /collections/weather_forecast/instances:
    get:
      summary: Get pre-defined instances of weather_forecast
      description: Global deterministic Numerical Weather Prediction output. Each
        model run is exposed as an EDR instance (/instances/{instanceId}) identified
        by an RFC3339 datestamp; a data query with no instance targets the latest
        run.
      operationId: GetInstancesWeatherForecast
      tags:
      - weather_forecast
      parameters:
      - name: f
        in: query
        required: false
        description: 'The optional f parameter indicates the output format which the
          server shall provide as part of the response document. Formats for this
          instance list: json, html.'
        schema:
          type: string
          enum:
          - json
          - html
        style: form
        explode: false
      responses:
        '200':
          description: Feature collection
          content:
            application/json:
              schema:
                type: object
                required:
                - type
                - features
                properties:
                  type:
                    type: string
                    enum:
                    - FeatureCollection
                    default: FeatureCollection
                  features:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                description: RFC 9457 problem details
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri-reference
              example:
                type: about:blank
                title: Invalid or missing parameter
                status: 400
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                type: object
                description: RFC 9457 problem details
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri-reference
