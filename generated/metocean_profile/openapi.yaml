  /collections/weather_forecast/instances/{instanceId}/position:
    get:
      summary: query weather_forecast instance by position
      description: Global deterministic Numerical Weather Prediction output. Each
        model run is exposed as an EDR instance (/instances/{instanceId}) identified
        by an RFC3339 datestamp; a data query with no instance targets the latest
        run.
      operationId: QueryPositionInstanceWeatherForecast
      tags:
      - weather_forecast
      parameters:
      - $ref: https://schemas.opengis.net/ogcapi/edr/1.0/openapi/parameters/instanceId.yaml
      - $ref: https://schemas.opengis.net/ogcapi/edr/1.0/openapi/parameters/positionCoords.yaml
      - $ref: https://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/ogcapi-features-1.yaml#/components/parameters/datetime
      - name: parameter-name
        in: query
        required: false
        description: 'Comma-separated list of parameters to retrieve. Parameters of
          this collection:

          - `gh` (unit Geopotential metre; symbol gpm)

          - `t` (unit Kelvin; symbol K)

          - `u` (unit Metre per Second; symbol m/s)

          - `v` (unit Metre per Second; symbol m/s)

          - `r` (unit Percent; symbol %)

          - `msl` (unit Pascal; symbol Pa)

          - `2t` (unit Kelvin; symbol K)

          - `mn2t3` (unit Kelvin; symbol K)

          - `mx2t3` (unit Kelvin; symbol K)

          - `mn2t6` (unit Kelvin; symbol K)

          - `mx2t6` (unit Kelvin; symbol K)

          - `2d` (unit Kelvin; symbol K)

          - `10u` (unit Metre per Second; symbol m/s)

          - `10v` (unit Metre per Second; symbol m/s)

          - `10fg` (unit Metre per Second; symbol m/s)

          - `tp` (unit Metre; symbol m)

          - `cape` (unit Joule per Kilogram; symbol J/kg)

          - `tcw` (unit Kilogram per Square Metre; symbol kg/m2)

          - `tcc` (unit Dimensionless; symbol 1)'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - gh
            - t
            - u
            - v
            - r
            - msl
            - 2t
            - mn2t3
            - mx2t3
            - mn2t6
            - mx2t6
            - 2d
            - 10u
            - 10v
            - 10fg
            - tp
            - cape
            - tcw
            - tcc
      - name: crs
        in: query
        required: false
        description: 'Identifier of the coordinate reference system for the response.
          Supported for this collection: OGC:CRS84.'
        schema:
          type: string
          enum:
          - OGC:CRS84
          default: OGC:CRS84
      - $ref: https://schemas.opengis.net/ogcapi/edr/1.0/openapi/parameters/z.yaml
      - name: f
        in: query
        required: false
        description: 'The optional f parameter indicates the output format which the
          server shall provide as part of the response document. Formats for this
          query: CoverageJSON. Default: CoverageJSON.'
        schema:
          type: string
          enum:
          - CoverageJSON
          default: CoverageJSON
        style: form
        explode: false
