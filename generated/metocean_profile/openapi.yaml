      description: Global deterministic Numerical Weather Prediction output. Each
        model run is exposed as an EDR instance (/instances/{instanceId}) identified
        by an RFC3339 datestamp; a data query with no instance targets the latest
        run.
      operationId: DescribeWeatherForecastCollection
      tags:
      - weather_forecast
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Collection metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - links
                - extent
                properties:
                  id:
                    type: string
                    example: weather_forecast
                  title:
                    type: string
                    example: Global deterministic NWP model forecast
                  description:
                    type: string
                    example: Global deterministic Numerical Weather Prediction output.
                      Each model run is exposed as an EDR instance (/instances/{instanceId})
                      identified by an RFC3339 datestamp; a data query with no instance
                      targets the latest run.
                  keywords:
                    type: array
                    items:
                      type: string
                    example:
                    - NWP
                    - forecast
                    - global deterministic
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
