components:
  parameters:
    f:
      name: f
      in: query
      required: false
      description: The optional f parameter indicates the output format which the
        server shall provide as part of the response document.
      schema:
        type: string
        enum:
        - json
        - html
        - application/prs.coverage+json
        - application/geo+json
        - application/netcdf
      style: form
      explode: false
    lang:
      name: lang
      in: query
      required: false
      description: The optional lang parameter instructs the server return a response
        in a certain language, if supported.
      schema:
        type: string
        default: en-US
        enum:
        - en-US
  responses:
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            type: object
