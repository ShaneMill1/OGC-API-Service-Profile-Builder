- name: edr-zarr-difference
- name: edr-zarr-difference-streaming
- name: edr-zarr-wind-streaming
- name: jobs
paths:
  /:
    get:
      summary: Landing page
      description: Landing page
      operationId: getLandingPage
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    contains:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        rel:
                          const: profile
                        href:
                          const: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/nwsviz
                  title:
                    type: string
                    const: NWSViz EDR Service Profile
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
