  /collections/aigfs0p25_v1p0_global_latlon:
    get:
      summary: Get AIGFS 0.25 Degree Global LatLon metadata
      description: AIGFS0P25_V1P0_GLOBAL weather data for LATLON region stored in
        icechunk format
