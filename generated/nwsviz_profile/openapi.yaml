paths:
  /:
    get:
      summary: Landing page
      description: Landing page
      operationId: getLandingPage
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                          enum:
                          - self
                          - service-desc
                          - service-doc
                          - conformance
                          - data
                          - profile
                        type:
                          type: string
                        title:
                          type: string
                        hreflang:
                          type: string
                    example:
                    - href: /
                      rel: self
                      type: application/json
                      title: this document
                    - href: /api
                      rel: service-desc
                      type: application/vnd.oai.openapi+json;version=3.0.0
                      title: the API definition
                    - href: /api.html
                      rel: service-doc
                      type: text/html
                      title: the API documentation
                    - href: /conformance
                      rel: conformance
                      type: application/json
                      title: OGC API conformance classes implemented by this server
                    - href: /collections
                      rel: data
                      type: application/json
                      title: Information about the collections
                    - href: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/nwsviz
                      rel: profile
                      type: application/yaml
                      title: OpenAPI Specification Profile for nwsviz
                  title:
                    type: string
                    example: NWSViz EDR Service Profile
                  version:
                    type: string
                    example: '1.0'
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
        '500':
