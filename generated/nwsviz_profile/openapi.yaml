openapi: 3.1.0
info:
  title: NWSViz EDR Service Profile
  version: '1.0'
  description: 'OGC API - EDR Part 3 Service Profile: NWSViz EDR Service Profile'
  x-ogc-profile: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/nwsviz
  x-keywords: []
  contact:
    name: Shane Mill
    x-organization: NOAA/NWS/MDL
servers:
- url: /
  description: Placeholder server URL. Per OGC API - EDR Part 3 REQ_publishing, this
    profile document is implementation-independent. Implementations SHALL substitute
    their own server URL.
