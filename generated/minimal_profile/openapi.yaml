components:
  parameters:
    f:
      name: f
      in: query
      required: false
      description: The optional f parameter indicates the output format which the
        server shall provide as part of the response document.
      schema:
        type: string
        enum:
        - json
        - html
        - application/geo+json
      style: form
      explode: false
    lang:
      name: lang
      in: query
      required: false
      description: The optional lang parameter instructs the server return a response
        in a certain language, if supported.
      schema:
        type: string
        default: en-US
        enum:
        - en-US
  responses:
    default:
      description: Unexpected error
      content:
        application/problem+json:
          schema:
            type: object
            required:
            - type
            - title
            properties:
              type:
                type: string
                format: uri-reference
                default: about:blank
                description: A URI reference that identifies the problem type (RFC
                  9457).
              title:
                type: string
                description: A short, human-readable summary of the problem type.
              status:
                type: integer
                description: The HTTP status code generated by the origin server.
              detail:
                type: string
                description: A human-readable explanation specific to this occurrence
                  of the problem.
              instance:
                type: string
                format: uri-reference
                description: A URI reference that identifies the specific occurrence
                  of the problem.
