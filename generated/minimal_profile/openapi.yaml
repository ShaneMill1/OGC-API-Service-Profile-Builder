  /collections:
    get:
      summary: Collections
      description: Collections
      operationId: getCollections
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Collections
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                - collections
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    example:
                    - href: /collections
                      rel: self
                      type: application/json
                      title: this document
                    - href: /collections?f=html
                      rel: alternate
                      type: text/html
                      title: this document as HTML
                  collections:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - links
                      - extent
                      properties:
                        id:
                          type: string
                          example: temperature
                        title:
                          type: string
                          example: Temperature Observations
                        description:
                          type: string
                          example: Real-time temperature observations
                        keywords:
                          type: array
                          items:
                            type: string
                        links:
                          type: array
                          items:
                            type: object
                            required:
                            - href
                            - rel
                            properties:
                              href:
                                type: string
                              rel:
                                type: string
                              type:
                                type: string
                              title:
                                type: string
                          example:
                          - href: https://example.com/collections/temperature
                            rel: self
                            type: application/json
                        crs:
                          type: array
                          items:
                            type: string
                        output_formats:
                          type: array
                          items:
                            type: string
                        parameter_names:
                          type: object
                          additionalProperties: false
                          properties:
                            temp:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                description:
                                  type: string
                                  enum:
                                  - Air temperature
                                  default: Air temperature
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Air Temperature
                                      default: Air Temperature
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Celsius
                                      default: Celsius
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - °C
                                          default: °C
                                        type:
                                          type: string
                                          enum:
                                          - http://www.opengis.net/def/uom/UCUM/degC
                                          default: http://www.opengis.net/def/uom/UCUM/degC
                        extent:
                          type: object
                          required:
                          - spatial
                          properties:
                            spatial:
                              type: object
                              required:
                              - bbox
                              - crs
                              properties:
                                bbox:
                                  type: array
                                  items:
                                    type: array
                                    items:
                                      type: number
                                  example:
                                  - - -180.0
                                    - -90.0
                                    - 180.0
                                    - 90.0
                                crs:
                                  type: string
                                  example: http://www.opengis.net/def/crs/OGC/1.3/CRS84
                        data_queries:
                          type: object
                          properties: {}
                          additionalProperties: false
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
        '500':
