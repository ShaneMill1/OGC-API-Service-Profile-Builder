  /collections/temperature/items:
    get:
      summary: query temperature by items
      description: Real-time temperature observations
      operationId: QueryItemsTemperature
      tags:
      - temperature
      parameters:
      - name: bbox
        in: query
        required: false
        style: form
        explode: false
        description: 'Only features that intersect the bounding box are selected:
          minLon,minLat,maxLon,maxLat (optionally with min/max height).'
        schema:
          type: array
          minItems: 4
          maxItems: 6
          items:
            type: number
      - $ref: https://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/ogcapi-features-1.yaml#/components/parameters/datetime
      - name: parameter-name
        in: query
        required: false
        description: 'Comma-separated list of parameters to retrieve. Parameters of
          this collection:

          - `temp` (unit Celsius; symbol °C)'
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - temp
      - name: crs
        in: query
        required: false
        description: Identifier of the coordinate reference system for the response.
        schema:
          type: string
      - name: f
        in: query
        required: false
        description: 'The optional f parameter indicates the output format which the
          server shall provide as part of the response document. Formats for this
          query: GeoJSON. Default: GeoJSON.'
        schema:
          type: string
          enum:
          - GeoJSON
          default: GeoJSON
        style: form
        explode: false
      - name: limit
        in: query
        required: false
        description: Limits the number of features returned in the response.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
      - name: offset
        in: query
        required: false
        description: Index of the first feature to return (0-based); used with limit
          to page through results.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: GeoJSON data response
          content:
            application/geo+json:
              schema:
                type: object
                required:
                - type
                - features
                properties:
                  type:
                    type: string
                    enum:
                    - FeatureCollection
                  features:
                    type: array
                    items:
                      type: object
                      required:
                      - type
                      - geometry
                      - properties
                      properties:
                        type:
                          type: string
                          enum:
                          - Feature
                        id:
                          type: string
                        geometry:
                          type: object
                          required:
                          - type
                          - coordinates
                          properties:
                            type:
                              type: string
                              enum:
                              - Point
                            coordinates:
                              type: array
                        properties:
                          type: object
                          properties:
                            datetime:
                              type: string
                              format: date-time
                              description: Observation time (RFC 3339).
                            temp:
                              type: object
                              description: Air temperature
                              properties:
                                value:
                                  type: number
                                unit:
                                  type: object
                                  example:
                                    label: Celsius
                                    symbol:
                                      value: °C
                                      type: http://www.opengis.net/def/uom/UCUM/degC
                  bbox:
                    type: array
                    items:
                      type: number
                    minItems: 4
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    description: Navigation links for paging (self, next, prev).
                    example:
                    - href: /collections/{collectionId}/items?limit=10&offset=0
                      rel: self
                      type: application/geo+json
                      title: this page
                    - href: /collections/{collectionId}/items?limit=10&offset=10
                      rel: next
                      type: application/geo+json
                      title: next page
                  numberMatched:
                    type: integer
                    minimum: 0
                    description: Total number of features matching the query across
                      all pages.
                  numberReturned:
                    type: integer
                    minimum: 0
                    description: Number of features returned in this page.
                  timeStamp:
                    type: string
                    format: date-time
                    description: Time when the response was generated.
                externalDocs:
                  description: GeoJSON schema
                  url: https://geojson.org/schema/FeatureCollection.json
              example:
                type: FeatureCollection
                features:
                - type: Feature
                  id: '1'
                  geometry:
                    type: Point
                    coordinates:
                    - 0.0
                    - 0.0
                  properties:
                    datetime: '2026-01-01T00:00:00Z'
                    temp:
                      value: 0.0
                      unit:
                        label: Celsius
                        symbol:
                          value: °C
                          type: http://www.opengis.net/def/uom/UCUM/degC
                bbox:
                - -180.0
                - -90.0
                - 180.0
                - 90.0
        '204':
          description: No data available for the requested query (empty result inside
            the extent)
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                description: RFC 9457 problem details
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri-reference
              example:
                type: about:blank
                title: Invalid or missing parameter
                status: 400
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                type: object
                description: RFC 9457 problem details
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
                    format: uri-reference
              example:
                type: about:blank
                title: Server error
                status: 500
  /collections/temperature/items/{featureId}:
    get:
      summary: Get Temperature Observations item by id
      description: Real-time temperature observations
      operationId: GetTemperatureFeature
      tags:
      - temperature
      parameters:
      - name: featureId
        in: path
        required: true
        description: Feature identifier
        schema:
          type: string
      - name: crs
        in: query
        required: false
        description: Identifier of the coordinate reference system for the response.
        schema:
          type: string
      - name: f
        in: query
        required: false
        description: 'The optional f parameter indicates the output format which the
          server shall provide as part of the response document. Formats for this
          feature: GeoJSON. Default: GeoJSON.'
        schema:
          type: string
          enum:
          - GeoJSON
          default: GeoJSON
        style: form
        explode: false
      responses:
        '200':
          description: GeoJSON feature response
          content:
            application/geo+json:
              schema:
                type: object
                required:
                - type
                - geometry
                - properties
                properties:
                  type:
                    type: string
                    enum:
                    - Feature
                  id:
                    type: string
                  geometry:
                    type: object
                    required:
                    - type
                    - coordinates
                    properties:
                      type:
                        type: string
                        enum:
                        - Point
                      coordinates:
                        type: array
                  properties:
                    type: object
                    properties:
                      datetime:
                        type: string
                        format: date-time
                        description: Observation time (RFC 3339).
                      temp:
                        type: object
                        description: Air temperature
                        properties:
                          value:
                            type: number
                          unit:
                            type: object
                            example:
                              label: Celsius
                              symbol:
                                value: °C
                                type: http://www.opengis.net/def/uom/UCUM/degC
                externalDocs:
                  description: GeoJSON schema
                  url: https://geojson.org/schema/FeatureCollection.json
              example:
                type: Feature
                id: '1'
                geometry:
                  type: Point
