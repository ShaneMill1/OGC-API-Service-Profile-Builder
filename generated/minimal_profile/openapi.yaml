openapi: 3.1.0
info:
  title: Minimal EDR Profile Example
  version: '1.0'
  description: 'OGC API - EDR Part 3 Service Profile: Minimal EDR Profile Example'
  x-ogc-profile: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/minimal_profile
  x-keywords: []
  contact:
    name: Minimal EDR Profile Example
servers:
- url: /
  description: Placeholder server URL. Per OGC API - EDR Part 3 REQ_publishing, this
    profile document is implementation-independent. Implementations SHALL substitute
    their own server URL.
tags:
- name: server
  description: Minimal EDR Profile Example
- name: temperature
  description: Real-time temperature observations
paths:
  /:
    get:
      summary: Landing page
      description: Landing page
      operationId: getLandingPage
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    contains:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        rel:
                          const: profile
                        href:
                          const: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/minimal_profile
                  title:
                    type: string
                    const: Minimal EDR Profile Example
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
  /conformance:
    get:
      summary: API conformance definition
      description: API conformance definition
      operationId: getConformanceDeclaration
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Conformance classes
          content:
            application/json:
              schema:
                type: object
                required:
                - conformsTo
                properties:
                  conformsTo:
                    type: array
                    items:
                      type: string
                    contains:
                      enum:
                      - http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/core
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
  /collections:
    get:
      summary: Collections
      description: Collections
      operationId: getCollections
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Collections list
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
  /openapi:
    get:
      summary: OpenAPI definition
      description: Retrieve the OpenAPI definition document for this API.
      operationId: getOpenAPI
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      responses:
        '200':
          description: OpenAPI document
        default:
          $ref: '#/components/responses/default'
  /collections/temperature:
    get:
      summary: Get Temperature Observations metadata
      description: Real-time temperature observations
      operationId: DescribeTemperatureCollection
      tags:
      - temperature
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Collection metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - links
                - extent
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  keywords:
                    type: array
                    items:
                      type: string
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                  crs:
                    type: array
                    items:
                      type: string
                  output_formats:
                    type: array
                    items:
                      type: string
                  parameter_names:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                      - type
                      - observedProperty
                      properties:
                        type:
                          type: string
                          const: Parameter
                        id:
                          type: string
                        label:
                          type: string
                        description:
                          type: string
                        data-type:
                          type: string
                          enum:
                          - integer
                          - float
                          - string
                        unit:
                          type: object
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            symbol:
                              oneOf:
                              - type: string
                              - type: object
                                required:
                                - value
                                - type
                                properties:
                                  value:
                                    type: string
                                  type:
                                    type: string
                        observedProperty:
                          type: object
                          required:
                          - label
                          properties:
                            id:
                              type: string
                            label:
                              type: string
                            description:
                              type: string
                        measurementType:
                          type: object
                          required:
                          - method
                          - duration
                          properties:
                            method:
                              type: string
                            duration:
                              type: string
                        extent:
                          type: object
                      additionalProperties: true
                  extent:
                    type: object
                    required:
                    - spatial
                    properties:
                      spatial:
                        type: object
                        required:
                        - bbox
                        - crs
                        properties:
                          bbox:
                            type: array
                            items:
                              type: array
                              items:
                                type: number
                              minItems: 4
                              maxItems: 6
                          crs:
                            type: string
                            enum:
                            - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                      temporal:
                        type: object
                        properties:
                          interval:
                            type: array
                            items:
                              type: array
                              items:
                                oneOf:
                                - type: string
                                  format: date-time
                                - type: 'null'
                              minItems: 2
                              maxItems: 2
                          values:
                            type: array
                            items:
                              type: string
                          trs:
                            type: string
                      vertical:
                        type: object
                        properties:
                          interval:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          values:
                            type: array
                            items:
                              type: string
                          vrs:
                            type: string
                      custom:
                        type: array
                        items:
                          type: object
                          required:
                          - id
                          - interval
                          - reference
                          properties:
                            id:
                              type: string
                            interval:
                              type: array
                              items:
                                type: string
                            values:
                              type: array
                              items:
                                type: string
                            reference:
                              type: string
                  data_queries:
                    type: object
                    description: Available EDR data query types for this collection
                    additionalProperties:
                      type: object
                      properties:
                        link:
                          type: object
                          properties:
                            href:
                              type: string
                            rel:
                              type: string
                            variables:
                              type: object
                              properties:
                                query_type:
                                  type: string
                                output_formats:
                                  type: array
                                  items:
                                    type: string
                                crs_details:
                                  type: array
                                  description: CRS values supported by this data query
                                  items:
                                    type: object
                                    required:
                                    - crs
                                    properties:
                                      crs:
                                        type: string
                                      wkt:
                                        type: string
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
  /collections/temperature/items:
    get:
      summary: Get Temperature Observations items
      description: Real-time temperature observations
      operationId: GetTemperatureFeatures
      tags:
      - temperature
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Feature collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    const: FeatureCollection
                  features:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
  /collections/temperature/items/{featureId}:
    get:
      summary: Get Temperature Observations item by id
      description: Real-time temperature observations
      operationId: GetTemperatureFeature
      tags:
      - temperature
      parameters:
      - name: featureId
        in: path
        required: true
        description: Feature identifier
        schema:
          type: string
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Feature collection
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    const: FeatureCollection
                  features:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
components:
  parameters:
    f:
      name: f
      in: query
      required: false
      description: The optional f parameter indicates the output format which the
        server shall provide as part of the response document.
      schema:
        type: string
        enum:
        - json
        - html
        - application/geo+json
      style: form
      explode: false
    lang:
      name: lang
      in: query
      required: false
      description: The optional lang parameter instructs the server return a response
        in a certain language, if supported.
      schema:
        type: string
        default: en-US
        enum:
        - en-US
  responses:
    default:
      description: Unexpected error
      content:
        application/json:
          schema:
            type: object
