                          type: string
                        title:
                          type: string
                    example:
                    - href: /collections
                      rel: self
                      type: application/json
                      title: this document
                    - href: /collections?f=html
                      rel: alternate
                      type: text/html
                      title: this document as HTML
                  collections:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - links
                      - extent
                      properties:
                        id:
                          type: string
                          example: nwp_radar_precipitation
                        title:
                          type: string
                          example: NWP Radar Collection
                        description:
                          type: string
                          example: NWP Radar Observations providing precipitation
                            information. Datetime values use RFC 3339 format in Zulu
                            Gregorian time (e.g. 2026-04-12T21:20:50Z).
                        keywords:
                          type: array
                          items:
                            type: string
                          example:
                          - NWP
                          - earth observations
                          - cube
                          - radius
                          - items
                          - datetime
                          - precipitation_amount
                          - radar
                        links:
                          type: array
                          items:
                            type: object
                            required:
                            - href
                            - rel
                            properties:
                              href:
                                type: string
                              rel:
                                type: string
                              type:
                                type: string
                              title:
                                type: string
                          example:
                          - href: https://example.com/collections/nwp_radar_precipitation
                            rel: self
                            type: application/json
                            title: NWP Radar Profile
                        crs:
                          type: array
                          items:
                            type: string
                          example:
                          - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                          - https://epsg.org/crs_4326/WGS-84.html
                          - https://epsg.org/crs_25832/ETRS89-UTM-zone-32N.html
                        output_formats:
                          type: array
                          items:
                            type: string
                          example:
                          - CoverageJSON
                          - GRIB2
                          - GeoTIFF
                          - HDF5
                          - NetCDF4
                          - PNG
                        parameter_names:
                          type: object
                          additionalProperties: false
                          properties:
                            precipitation_amount:
                              type: object
                              required:
                              - type
                              - observedProperty
                              additionalProperties: false
                              properties:
                                type:
                                  type: string
                                  enum:
                                  - Parameter
                                  default: Parameter
                                description:
                                  type: string
                                  enum:
                                  - Precipitation amount in kg m-2.
                                  default: Precipitation amount in kg m-2.
                                observedProperty:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - Precipitation amount of water in all phases
                                      default: Precipitation amount of water in all
                                        phases
                                    id:
                                      type: string
                                      enum:
                                      - https://vocab.nerc.ac.uk/standard_name/precipitation_amount
                                      default: https://vocab.nerc.ac.uk/standard_name/precipitation_amount
                                  required:
                                  - label
                                unit:
                                  type: object
                                  properties:
                                    label:
                                      type: string
                                      enum:
                                      - 'Precipitation amount of water in all phases:
                                        kilograms per metres squared.'
                                      default: 'Precipitation amount of water in all
                                        phases: kilograms per metres squared.'
                                    symbol:
                                      type: object
                                      required:
                                      - value
                                      - type
                                      properties:
                                        value:
                                          type: string
                                          enum:
                                          - kg m-2
                                          default: kg m-2
                                        type:
                                          type: string
                                          enum:
                                          - https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html
                                          default: https://cfconventions.org/Data/cf-standard-names/current/build/cf-standard-name-table.html
                        extent:
                          type: object
                          required:
                          - spatial
                          properties:
                            spatial:
                              type: object
                              required:
                              - bbox
                              - crs
                              properties:
                                bbox:
                                  type: array
                                  items:
                                    type: array
                                    items:
                                      type: number
                                  example:
                                  - - -180.0
                                    - -90.0
                                    - 180.0
                                    - 90.0
                                crs:
                                  type: string
                                  example: http://www.opengis.net/def/crs/OGC/1.3/CRS84
                            temporal:
                              type: object
                              required:
                              - trs
                              properties:
                                trs:
                                  type: string
                                  example: http://www.opengis.net/def/uom/ISO-8601/0/Gregorian
                                interval:
                                  type: array
                                  items:
                                    type: array
                                    items:
                                      type: string
                                      nullable: true
                                  example:
                                  - - 2020-01-01 00:00:00+00:00
                                    - null
                                values:
                                  type: array
                                  items:
                                    type: string
                                  example:
                                  - 2020-01-01T00:00:00Z/..
                            vertical:
                              type: object
                              required:
                              - vrs
                              properties:
                                vrs:
                                  type: string
                                  example: https://epsg.org/crs/wkt/id/3855
                                interval:
                                  type: array
                                  items:
                                    type: array
                                    items:
                                      type: number
                                  example:
                                  - - '0'
                                    - '0'
                                values:
                                  type: array
                                  items:
                                    type: string
                                  example:
                                  - '0'
                                positive:
                                  type: string
                                  example: up
                        data_queries:
                          type: object
                          properties:
                            radius:
                              type: object
                              properties:
                                link:
                                  type: object
                                  properties:
                                    href:
                                      type: string
                                      example: https://example.com/collections/nwp_radar_precipitation/radius
                                    rel:
                                      type: string
                                      example: data
                                    variables:
                                      type: object
                                      properties:
                                        query_type:
                                          type: string
                                          example: radius
                                        default_output_format:
                                          type: string
                                          example: GeoTIFF
                                        output_formats:
                                          type: array
                                          items:
                                            type: string
                                          example:
                                          - CoverageJSON
                                          - GRIB2
                                          - GeoTIFF
                                          - HDF5
                                          - NetCDF4
                                          - PNG
                                        crs:
                                          type: array
                                          items:
                                            type: string
                                          example:
                                          - https://epsg.org/crs_4326/WGS-84.html
                                          - https://epsg.org/crs_25832/ETRS89-UTM-zone-32N.html
                            cube:
                              type: object
                              properties:
                                link:
                                  type: object
                                  properties:
                                    href:
                                      type: string
                                      example: https://example.com/collections/nwp_radar_precipitation/cube
                                    rel:
                                      type: string
                                      example: data
                                    variables:
                                      type: object
                                      properties:
                                        query_type:
                                          type: string
                                          example: cube
                                        default_output_format:
                                          type: string
                                          example: GeoTIFF
                                        output_formats:
                                          type: array
                                          items:
                                            type: string
                                          example:
                                          - CoverageJSON
                                          - GRIB2
                                          - GeoTIFF
                                          - HDF5
                                          - NetCDF4
                                          - PNG
                                        crs:
                                          type: array
                                          items:
                                            type: string
                                          example:
                                          - https://epsg.org/crs_4326/WGS-84.html
                                          - https://epsg.org/crs_25832/ETRS89-UTM-zone-32N.html
                            items:
                              type: object
                              properties:
                                link:
                                  type: object
                                  properties:
                                    href:
                                      type: string
                                      example: https://example.com/collections/nwp_radar_precipitation/items
                                    rel:
                                      type: string
                                      example: data
                                    variables:
                                      type: object
                                      properties:
                                        query_type:
                                          type: string
                                          example: items
                                        default_output_format:
                                          type: string
                                          example: GeoTIFF
                                        output_formats:
                                          type: array
                                          items:
                                            type: string
                                          example:
                                          - CoverageJSON
                                          - GRIB2
                                          - GeoTIFF
                                          - HDF5
                                          - NetCDF4
                                          - PNG
                          additionalProperties: false
                        provider:
                          type: object
                          properties:
                            name:
                              type: string
                              example: Austrian Military
                            url:
                              type: string
                              example: https://www.bmlv.gv.at/english/forces/organisation.shtml
                            contact:
                              type: object
                              properties:
                                email:
                                  type: string
                                  example: presse@bmlvs.gv.at
                                hours:
                                  type: string
                                  example: Monday to Friday 08:00 - 17:00
                                instructions:
                                  type: string
                                  example: During hours of Service
                                address:
                                  type: string
                                  example: Ministry of Defence, Kommunikation, Rossauer
                                    Lände 1
                                postalcode:
                                  type: string
                                  example: A-1090
                                city:
                                  type: string
                                  example: Vienna
                                country:
                                  type: string
                                  example: Austria
                        classification:
                          type: object
                          properties:
                            classification_level:
                              type: string
                              example: NATO RESTRICTED (NR)
                            classification_system:
                              type: string
                              example: NATO
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
