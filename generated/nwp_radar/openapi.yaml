openapi: 3.1.0
info:
  title: NWP Radar Profile
  version: '1.0'
  description: 'Service profile for DGIWG NWP radar data, providing precipitation
    amount via OGC API - EDR. Supports cube, radius, and items queries with GET and
    POST.

    '
  x-ogc-profile: http://www.dgiwg.org/std/edr/1.0/req/nwp_radar
  x-keywords:
  - cube
  - radius
  - items
  - datetime
  - precipitation_amount
  - radar
  contact:
    name: Austrian Military
    url: https://www.bmlv.gv.at/english/forces/organisation.shtml
    email: presse@bmlvs.gv.at
    x-hours: Monday to Friday 08:00 - 17:00
    x-instructions: During hours of Service
    x-address: Ministry of Defence, Kommunikation, Rossauer Lände 1
    x-postalcode: A-1090
    x-city: Vienna
    x-country: Austria
  x-classification:
    level: NATO RESTRICTED (NR)
    system: NATO
  x-metadata-date: 2026-06-25T07:31Z
  x-resource-publish-date: 2026-06-24T14:10Z
  x-default-locale: eng
servers:
- url: /
  description: Placeholder server URL. Per OGC API - EDR Part 3 REQ_publishing, this
    profile document is implementation-independent. Implementations SHALL substitute
    their own server URL.
tags:
- name: server
  description: NWP Radar Profile
- name: nwp_radar_precipitation
  description: NWP Radar Observations providing precipitation information. Datetime
    values use RFC 3339 format in Zulu Gregorian time (e.g. 2026-04-12T21:20:50Z).
