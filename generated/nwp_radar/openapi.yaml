  /collections/nwp_radar_precipitation:
    get:
      summary: Get NWP Radar Collection metadata
      description: NWP Radar Observations providing precipitation information. Datetime
        values use RFC 3339 format in Zulu Gregorian time (e.g. 2026-04-12T21:20:50Z).
      operationId: DescribeNwpRadarPrecipitationCollection
      tags:
      - nwp_radar_precipitation
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Collection metadata
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - links
                - extent
                properties:
                  id:
                    type: string
                    example: nwp_radar_precipitation
                  title:
                    type: string
                    example: NWP Radar Collection
                  description:
                    type: string
                    example: NWP Radar Observations providing precipitation information.
                      Datetime values use RFC 3339 format in Zulu Gregorian time (e.g.
                      2026-04-12T21:20:50Z).
                  keywords:
                    type: array
                    items:
                      type: string
                    example:
                    - NWP
                    - earth observations
                    - cube
                    - radius
                    - items
                    - datetime
                    - precipitation_amount
                    - radar
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    example:
                    - href: https://example.com/collections/nwp_radar_precipitation
                      rel: self
                      type: application/json
                      title: NWP Radar Profile
                  crs:
                    type: array
                    items:
                      type: string
                    example:
                    - http://www.opengis.net/def/crs/OGC/1.3/CRS84
                    - https://epsg.org/crs_4326/WGS-84.html
                    - https://epsg.org/crs_25832/ETRS89-UTM-zone-32N.html
                  output_formats:
                    type: array
                    items:
                      type: string
                    example:
                    - CoverageJSON
                    - GRIB2
                    - GeoTIFF
                    - HDF5
                    - NetCDF4
                    - PNG
                  parameter_names:
                    type: object
                    additionalProperties: false
                    properties:
                      precipitation_amount:
                        type: object
