  /collections/nwp_radar_precipitation/items:
    get:
      summary: query nwp_radar_precipitation by items
      description: NWP Radar Observations providing precipitation information. Datetime
        values use RFC 3339 format in Zulu Gregorian time (e.g. 2026-04-12T21:20:50Z).
      operationId: QueryItemsNwpRadarPrecipitation
      tags:
      - nwp_radar_precipitation
      parameters:
      - name: bbox
        in: query
        description: Bounding box filter
        schema:
          type: string
      - $ref: https://schemas.opengis.net/ogcapi/features/part1/1.0/openapi/ogcapi-features-1.yaml#/components/parameters/datetime
      - $ref: https://schemas.opengis.net/ogcapi/edr/1.0/openapi/parameters/parameter-name.yaml
      - $ref: https://schemas.opengis.net/ogcapi/edr/1.0/openapi/parameters/z.yaml
      - name: f
        in: query
        required: false
        description: The optional f parameter indicates the output format which the
          server shall provide as part of the response document. Defaults to GeoTIFF
          for this query.
        schema:
          type: string
          enum:
          - json
          - html
          - application/json
          - application/grib; edition=2
          - image/tiff; application=geotiff
          - application/x-hdf
          - application/netcdf
          - image/png
          default: image/tiff; application=geotiff
        style: form
        explode: false
      - name: limit
        in: query
        required: false
        description: Limits the number of features returned in the response.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
      responses:
        '200':
          description: Coverage data response
          content:
            application/prs.coverage+json:
              schema:
                $ref: https://schemas.opengis.net/covjson/1.0/coveragejson.json
            application/vnd.cov+json:
              schema:
                $ref: https://schemas.opengis.net/covjson/1.0/coveragejson.json
            application/grib; edition=2:
              schema:
                type: object
            image/tiff; application=geotiff:
              schema:
                type: object
            application/x-hdf:
              schema:
                type: object
            application/netcdf:
              schema:
                type: object
            image/png:
              schema:
                $ref: https://w3c.github.io/png/
        '204':
          description: No data available for the requested query (empty result inside
            the extent)
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
    post:
      summary: query (POST) nwp_radar_precipitation by items
      description: NWP Radar Observations providing precipitation information. Datetime
        values use RFC 3339 format in Zulu Gregorian time (e.g. 2026-04-12T21:20:50Z).
      operationId: QueryPostItemsNwpRadarPrecipitation
      tags:
      - nwp_radar_precipitation
      requestBody:
        required: true
        description: Query parameters for items request
        content:
          application/json:
            schema:
              type: object
              properties:
                bbox:
                  type: string
                  description: Bounding box filter
                datetime:
                  type: string
                  description: RFC 3339 datetime or interval
                parameter-name:
                  type: string
                  description: Comma-separated list of parameter names to return
                z:
                  type: string
                  description: Vertical level(s)
                f:
                  type: string
                  description: Response format
                  default: image/tiff; application=geotiff
      responses:
        '200':
          description: Coverage data response
          content:
            application/prs.coverage+json:
              schema:
                $ref: https://schemas.opengis.net/covjson/1.0/coveragejson.json
            application/vnd.cov+json:
              schema:
