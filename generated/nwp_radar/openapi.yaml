                            type: string
                            example: A-1090
                          city:
                            type: string
                            example: Vienna
                          country:
                            type: string
                            example: Austria
                  classification:
                    type: object
                    properties:
                      classification_level:
                        type: string
                        example: NATO RESTRICTED (NR)
                      classification_system:
                        type: string
                        example: NATO
                  metadata-date:
                    type: string
                    example: 2026-06-25T07:31Z
                  resource-publish-date:
                    type: string
                    example: 2026-06-24T14:10Z
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
