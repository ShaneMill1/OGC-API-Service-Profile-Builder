                      title: OpenAPI Specification Profile for nwp_radar
                  title:
                    type: string
                    example: NWP Radar Profile
                  version:
                    type: string
                    example: '1.0'
                  description:
                    type: string
                    example: Service profile for DGIWG NWP radar data, providing precipitation
                      amount via OGC API - EDR. Supports cube, radius, and items queries
                      with GET and POST.
                  keywords:
                    type: array
                    items:
                      type: string
                    example:
