            application/grib; edition=2:
              schema:
                type: object
            image/tiff; application=geotiff:
              schema:
                type: object
            application/x-hdf:
              schema:
                type: object
            application/netcdf:
              schema:
                type: object
            image/png:
              schema:
                $ref: https://w3c.github.io/png/
        '204':
          description: No data available for the requested query (empty result inside
            the extent)
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
