asyncapi: 3.0.0
info:
  title: NWS Connect Service Profile AsyncAPI
  version: '1.1'
servers:
  websocket_local:
    description: Native pygeoapi live-map WebSocket (local development)
    host: ''
    protocol: ws
    security: []
    pathname: /ws
  websocket_secure:
    description: Native pygeoapi live-map WebSocket (production)
    host: ''
    protocol: wss
    security: []
    pathname: /ws
  amqp:
    description: 'AMQP 1.0 broker (edr-broker, RabbitMQ 4.x native AMQP 1.0). Consume
      from a queue bound to the amq.topic exchange with binding key collections.*.items
      (v2 source address /queues/<your-queue>; declare and bind it first). Authenticate
      with SASL PLAIN: your account email as the username and a named WebSocket key
      (POST /api/ws-keys, value starts with wsk_) as the password. Read-only; fire-and-forget
      (re-hydrate current state from /collections/{id}/items on reconnect).'
    host: edr-broker:5672
    protocol: amqp1
    security: []
  mqtt:
    description: MQTT broker (edr-broker, RabbitMQ MQTT plugin over the same amq.topic
      exchange). Subscribe to topic collections/+/items (or a specific collections/<id>/items).
      Authenticate with your account email as the username and a named WebSocket key
      (wsk_...) as the password. Read-only; fire-and-forget.
    host: edr-broker:1883
    protocol: mqtt
    security: []
channels:
  water_gauge_notifications:
    address: collections/water_gauge/items/#
    description: Real-time notifications for water_gauge
    messages:
      water_gaugeObservation:
        $ref: '#/components/messages/water_gaugeObservation'
    x-ogc-subscription:
      filters:
      - name: flood_stages
        description: Alert for selected flood stages (below_action, action, minor,
          moderate, major)
        schema:
          type: array
      - name: stations
        description: Comma-separated station IDs or 'all' for all stations
        schema:
          type: string
      - name: wfo
        description: Weather Forecast Office codes (e.g., PHI, AKQ, OKX)
        schema:
          type: string
      - name: email
        description: Email address for notifications
        schema:
          type: string
  wwa_notifications:
    address: collections/wwa/items/#
    description: Real-time notifications for wwa
    messages:
      wwaObservation:
        $ref: '#/components/messages/wwaObservation'
    x-ogc-subscription:
      filters:
      - name: event_types
        description: Weather event types to subscribe to (e.g., Tornado Warning, Flood
          Watch)
        schema:
          type: array
      - name: state
        description: Filter by one or more two-letter USPS state codes (comma separated,
          e.g. 'TN,IA'). Optional for email; REQUIRED for SMS delivery to bound message
          volume.
        schema:
          type: string
      - name: cwa
        description: Filter by County Warning Area code (comma-separated list allowed).
          Optional for email; either state or cwa is REQUIRED for SMS delivery.
        schema:
          type: string
      - name: email
        description: Email address for notifications (used when delivery_method=email).
        schema:
          type: string
      - name: delivery_method
        description: How alerts are delivered to the subscriber. 'email' is the default
          and requires SNS double-opt-in confirmation. 'sms' delivers directly to
          a US mobile number and requires the phone_number filter plus a state or
          cwa scope for cost containment. Standard carrier STOP/HELP keywords are
          honored.
        schema:
          type: string
      - name: phone_number
        description: US phone number in any common format (e.g., '(555) 234-5678',
          '555-234-5678', '+15552345678'). Required when delivery_method=sms; normalized
          to E.164 (+1XXXXXXXXXX) by the service.
        schema:
          type: string
      - name: alert_action
        description: Which warning lifecycle events should trigger a notification.
          'initial' (default) alerts only on the first NEW issuance of a warning.
          'upgrade' alerts only on follow-up SVS products that raise the IBW tier.
          'both' alerts on initial issuances and upgrades. Downgrades and routine
          follow-ups never re-alert regardless of this setting.
        schema:
          type: string
      - name: ibw_tier_min
        description: 'Minimum Impact-Based Warning tier that should trigger a notification.
          For SVR: CONSIDERABLE / DESTRUCTIVE. For TOR: PDS / EMERGENCY. Ignored for
          other event types.'
        schema:
          type: string
      - name: hail_min_in
        description: Notify when the warning's maximum hail size reaches this value
          in inches, in an initial SVR or a follow-up SVS. Combined with wind_min_mph
          via SNS $or so either threshold can fire the alert.
        schema:
          type: number
      - name: wind_min_mph
        description: Notify when the warning's maximum wind gust reaches this value
          in miles per hour, in an initial SVR or a follow-up SVS. Combined with hail_min_in
          via SNS $or.
        schema:
          type: number
  space_weather_notifications:
    address: collections/space_weather/items/#
    description: Real-time notifications for space_weather
    messages:
      space_weatherObservation:
        $ref: '#/components/messages/space_weatherObservation'
    x-ogc-subscription:
      filters:
      - name: message_type
        description: Filter by message type (Alert, Warning, Watch, Summary)
        schema:
          type: string
      - name: scale_category
        description: Filter by NOAA scale category (G, S, R)
        schema:
          type: string
      - name: scale_level
        description: Filter by minimum NOAA scale level (1-5)
        schema:
          type: number
      - name: email
        description: Email address for notifications
        schema:
          type: string
operations:
  receive_water_gauge_update:
    action: receive
    channel:
      $ref: '#/channels/water_gauge_notifications'
    messages:
    - $ref: '#/channels/water_gauge_notifications/messages/water_gaugeObservation'
  receive_wwa_update:
    action: receive
    channel:
      $ref: '#/channels/wwa_notifications'
    messages:
    - $ref: '#/channels/wwa_notifications/messages/wwaObservation'
  receive_space_weather_update:
    action: receive
    channel:
      $ref: '#/channels/space_weather_notifications'
    messages:
    - $ref: '#/channels/space_weather_notifications/messages/space_weatherObservation'
components:
  messages:
    water_gaugeObservation:
      payload:
        type: object
        required:
        - type
        - properties
        properties:
          type:
            type: string
            const: Feature
          properties:
            type: object
            required:
            - id
            - timestamp
            properties:
              id:
                type: string
              timestamp:
                type: string
                format: date-time
    wwaObservation:
      payload:
        type: object
        required:
        - type
        - properties
        properties:
          type:
            type: string
            const: Feature
          properties:
            type: object
            required:
            - id
            - timestamp
            properties:
              id:
                type: string
              timestamp:
                type: string
                format: date-time
    space_weatherObservation:
      payload:
        type: object
        required:
        - type
        - properties
        properties:
          type:
            type: string
            const: Feature
          properties:
            type: object
            required:
            - id
            - timestamp
            properties:
              id:
                type: string
              timestamp:
                type: string
                format: date-time
