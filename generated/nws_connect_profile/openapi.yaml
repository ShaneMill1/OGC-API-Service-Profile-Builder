openapi: 3.1.0
info:
  title: NWS Connect Service Profile
  version: '1.0'
  description: 'OGC API - EDR Part 3 Service Profile: NWS Connect Service Profile'
  x-ogc-profile: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/nws_connect
  x-keywords: []
  contact:
    name: Shane Mill
    x-organization: NOAA/NWS/MDL
servers:
- url: /
  description: Placeholder server URL. Per OGC API - EDR Part 3 REQ_publishing, this
    profile document is implementation-independent. Implementations SHALL substitute
    their own server URL.
tags:
- name: server
  description: NWS Connect Service Profile
- name: water_gauge
  description: Real-time GeoJSON notification messages for water gauge observations
    including flood stage information
- name: wwa
  description: NWS Weather Watches and Warnings from CAP (Common Alerting Protocol)
    alerts
- name: cwa
  description: Geographic boundaries of NWS County Warning Areas (CWA) in WKT format
- name: states
  description: Geographic boundaries of states within the United States
paths:
  /:
    get:
      summary: Landing page
      description: Landing page
      operationId: getLandingPage
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    contains:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        rel:
                          const: profile
                        href:
                          const: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/nws_connect
                  title:
                    type: string
                    const: NWS Connect Service Profile
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
  /conformance:
    get:
      summary: API conformance definition
      description: API conformance definition
      operationId: getConformanceDeclaration
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Conformance classes
          content:
            application/json:
              schema:
                type: object
                required:
                - conformsTo
                properties:
                  conformsTo:
                    type: array
                    items:
                      type: string
                    contains:
                      enum:
                      - http://www.opengis.net/spec/ogcapi-edr-1/1.0/conf/core
                      - http://www.opengis.net/spec/ogcapi-edr-2/1.0/conf/pubsub
        '400':
          description: Invalid or missing parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  description:
                    type: string
  /collections:
    get:
      summary: Collections
      description: Collections
      operationId: getCollections
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
