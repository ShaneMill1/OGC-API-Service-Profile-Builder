                                        type: string
                                        enum:
                                        - Alert Lifecycle Action
                                        default: Alert Lifecycle Action
                                      id:
                                        type: string
                                        enum:
                                        - alert_action
                                        default: alert_action
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - category
                                        default: category
                                      symbol:
                                        type: string
                                        enum:
                                        - category
                                        default: category
                              parent_item_id:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  id:
                                    type: string
                                    enum:
                                    - parent_item_id
                                    default: parent_item_id
                                  description:
                                    type: string
                                    enum:
                                    - Item id of the initial SVR or TOR this feature
                                      descends from. Every follow-up SVS carries the
                                      same parent_item_id as its parent warning so
                                      partners can correlate the lifecycle.
                                    default: Item id of the initial SVR or TOR this
                                      feature descends from. Every follow-up SVS carries
                                      the same parent_item_id as its parent warning
                                      so partners can correlate the lifecycle.
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
