                                    default: Parameter
                                  id:
                                    type: string
                                    enum:
                                    - CAP_info_urgency
                                    default: CAP_info_urgency
                                  description:
                                    type: string
                                    enum:
                                    - Urgency level (Immediate, Expected, Future,
                                      Past, Unknown)
                                    default: Urgency level (Immediate, Expected, Future,
                                      Past, Unknown)
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Urgency
                                        default: Urgency
