                              CAP_status:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  id:
                                    type: string
                                    enum:
                                    - CAP_status
                                    default: CAP_status
                                  description:
                                    type: string
