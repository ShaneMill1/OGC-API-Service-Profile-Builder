                                        default: Severity
                                      id:
                                        type: string
                                        enum:
                                        - severity
                                        default: severity
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - category
                                        default: category
                                      symbol:
                                        type: string
                                        enum:
