  /collections/wwa/items:
    get:
      summary: Get Weather Watches and Warnings items
      description: NWS Weather Watches and Warnings from CAP (Common Alerting Protocol)
        alerts
      operationId: GetWwaFeatures
      tags:
      - wwa
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      - name: limit
        in: query
        required: false
        description: Limits the number of features returned in the response.
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10
      - name: offset
        in: query
        required: false
        description: Index of the first feature to return (0-based); used with limit
          to page through results.
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Feature collection
          content:
            application/json:
              schema:
                type: object
                required:
                - type
                - features
                properties:
                  type:
                    type: string
                    enum:
                    - FeatureCollection
                    default: FeatureCollection
                  features:
                    type: array
                    items:
                      type: object
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                        type:
                          type: string
                        title:
                          type: string
                    description: Navigation links for paging (self, next, prev).
                    example:
                    - href: /collections/{collectionId}/items?limit=10&offset=0
                      rel: self
                      type: application/geo+json
                      title: this page
                    - href: /collections/{collectionId}/items?limit=10&offset=10
                      rel: next
                      type: application/geo+json
                      title: next page
                  numberMatched:
                    type: integer
                    minimum: 0
                    description: Total number of features matching the query across
                      all pages.
                  numberReturned:
                    type: integer
                    minimum: 0
                    description: Number of features returned in this page.
                  timeStamp:
                    type: string
                    format: date-time
                    description: Time when the response was generated.
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
