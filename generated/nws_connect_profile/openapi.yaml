                              rel: self
                              type: application/json
                            - href: https://www.weather.gov/disclaimer
                              rel: terms-of-use
                              type: text/html
                              title: Terms of Use
                          crs:
                            type: array
                            items:
                              type: string
                          output_formats:
                            type: array
                            items:
                              type: string
                          parameter_names:
                            type: object
                            additionalProperties: false
                            properties:
                              CAP_info_event:
                                type: object
                                required:
                                - type
