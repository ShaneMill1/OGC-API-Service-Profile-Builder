openapi: 3.0.0
info:
  title: NWS Connect Service Profile
  version: '1.1'
  description: 'OGC API - EDR Part 3 Service Profile for NWS Connect: real-time GeoJSON
    notification messages for water gauge observations, NWS Weather Watches, Warnings
    and Advisories, and NOAA SWPC space weather alerts, delivered over EDR Part 2
    PubSub (native WebSocket, AMQP 1.0, and MQTT) alongside the standard EDR Part
    1 Features endpoints.'
  x-ogc-profile: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/nws_connect
  x-keywords:
  - water gauge
  - flood
  - weather warnings
  - watches
  - advisories
  - CAP
  - space weather
  - SWPC
  - real-time
  - pubsub
  contact:
    name: NOAA/NWS/Meteorological Development Laboratory (MDL)
    url: https://www.weather.gov/mdl/
    email: nws.mdl.support@noaa.gov
    x-instructions: Data provided by the National Weather Service.
    x-country: USA
    x-organization: NOAA/NWS/MDL
servers:
- url: /
  description: Placeholder server URL. Per OGC API - EDR Part 3 REQ_publishing, this
    profile document is implementation-independent. Implementations SHALL substitute
    their own server URL.
tags:
- name: server
  description: NWS Connect Service Profile
- name: water_gauge
  description: Real-time GeoJSON notification messages for water gauge observations
    including flood stage information
- name: wwa
  description: NWS Weather Watches and Warnings from CAP (Common Alerting Protocol)
    alerts
- name: space_weather
  description: Alerts, warnings, watches, and summaries from the NOAA Space Weather
    Prediction Center (SWPC). Includes geomagnetic storms (G-scale), solar radiation
    storms (S-scale), and radio blackouts (R-scale).
- name: cwa
  description: Geographic boundaries of NWS County Warning Areas (CWA) in WKT format
    - NWS - CWA - boundaries - geographic
- name: states
  description: Geographic boundaries of states within the United States
paths:
  /:
    get:
      summary: Landing page
      description: Landing page
      operationId: getLandingPage
      tags:
      - server
      parameters:
      - $ref: '#/components/parameters/f'
      - $ref: '#/components/parameters/lang'
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                type: object
                required:
                - links
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      required:
                      - href
                      - rel
                      properties:
                        href:
                          type: string
                        rel:
                          type: string
                          enum:
                          - self
                          - service-desc
                          - service-doc
                          - conformance
                          - data
                          - profile
                        type:
                          type: string
                        title:
                          type: string
                        hreflang:
                          type: string
                    example:
                    - href: /
                      rel: self
                      type: application/json
                      title: this document
                    - href: /api
                      rel: service-desc
                      type: application/vnd.oai.openapi+json;version=3.0.0
                      title: the API definition
                    - href: /api.html
                      rel: service-doc
                      type: text/html
                      title: the API documentation
                    - href: /conformance
                      rel: conformance
                      type: application/json
                      title: OGC API conformance classes implemented by this server
                    - href: /collections
                      rel: data
                      type: application/json
                      title: Information about the collections
                    - href: http://www.opengis.net/spec/ogcapi-edr-3/1.0/req/nws_connect
                      rel: profile
                      type: application/yaml
                      title: OpenAPI Specification Profile for nws_connect
                  title:
                    type: string
                    example: NWS Connect Service Profile
                  version:
                    type: string
                    example: '1.1'
                  description:
                    type: string
                    example: 'OGC API - EDR Part 3 Service Profile for NWS Connect:
                      real-time GeoJSON notification messages for water gauge observations,
                      NWS Weather Watches, Warnings and Advisories, and NOAA SWPC
                      space weather alerts, delivered over EDR Part 2 PubSub (native
                      WebSocket, AMQP 1.0, and MQTT) alongside the standard EDR Part
                      1 Features endpoints.'
                  keywords:
                    type: array
                    items:
                      type: string
                    example:
                    - water gauge
                    - flood
                    - weather warnings
                    - watches
                    - advisories
                    - CAP
                    - space weather
                    - SWPC
                    - real-time
                    - pubsub
                  provider:
                    type: object
                    properties:
                      name:
                        type: string
                        example: NOAA/NWS/Meteorological Development Laboratory (MDL)
                      url:
                        type: string
                        example: https://www.weather.gov/mdl/
                      contact:
                        type: object
                        properties:
                          email:
                            type: string
                            example: nws.mdl.support@noaa.gov
                          instructions:
                            type: string
                            example: Data provided by the National Weather Service.
                          country:
                            type: string
                            example: USA
        '400':
          description: Invalid or missing parameter
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
        '500':
          description: Server error
          content:
            application/problem+json:
              schema:
                type: object
                required:
                - type
                - title
                properties:
                  type:
                    type: string
                    format: uri-reference
                    default: about:blank
                    description: A URI reference that identifies the problem type
                      (RFC 9457).
                  title:
                    type: string
                    description: A short, human-readable summary of the problem type.
                  status:
                    type: integer
                    description: The HTTP status code generated by the origin server.
                  detail:
                    type: string
                    description: A human-readable explanation specific to this occurrence
                      of the problem.
                  instance:
                    type: string
                    format: uri-reference
                    description: A URI reference that identifies the specific occurrence
                      of the problem.
