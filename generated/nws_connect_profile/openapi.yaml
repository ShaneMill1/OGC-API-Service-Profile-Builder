                                    - Alert status (Actual, Exercise, System, Test,
                                      Draft)
                                    default: Alert status (Actual, Exercise, System,
                                      Test, Draft)
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Status
                                        default: Status
                                      id:
                                        type: string
                                        enum:
                                        - status
                                        default: status
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - category
                                        default: category
                                      symbol:
                                        type: string
                                        enum:
                                        - category
                                        default: category
                              alert_action:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  id:
                                    type: string
                                    enum:
                                    - alert_action
                                    default: alert_action
                                  description:
                                    type: string
                                    enum:
                                    - The role this feature plays in its warning lifecycle.
                                      'initial' is the first NEW issuance of an SVR
                                      or TOR. 'upgrade' is a follow-up SVS that raises
                                      the Impact-Based Warning (IBW) tier over the
                                      parent warning. 'update' is a routine SVS that
                                      does not change the tier. 'cancel' is a CAN
                                      or EXP action.
                                    default: The role this feature plays in its warning
                                      lifecycle. 'initial' is the first NEW issuance
                                      of an SVR or TOR. 'upgrade' is a follow-up SVS
                                      that raises the Impact-Based Warning (IBW) tier
                                      over the parent warning. 'update' is a routine
                                      SVS that does not change the tier. 'cancel'
                                      is a CAN or EXP action.
