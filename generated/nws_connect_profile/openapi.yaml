                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - feet
                                        default: feet
                                      symbol:
                                        type: string
                                        enum:
                                        - ft
                                        default: ft
                              value:
                                type: object
                                required:
                                - type
                                - observedProperty
                                additionalProperties: false
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - Parameter
                                    default: Parameter
                                  id:
                                    type: string
                                    enum:
                                    - value
                                    default: value
                                  description:
                                    type: string
                                    enum:
                                    - Water gauge observation value
                                    default: Water gauge observation value
                                  observedProperty:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Gauge Height
                                        default: Gauge Height
                                      id:
                                        type: string
                                        enum:
                                        - gauge_height
                                        default: gauge_height
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - feet
                                        default: feet
                                      symbol:
                                        type: string
                                        enum:
                                        - ft
                                        default: ft
                          extent:
                            type: object
                            required:
                            - spatial
                            properties:
                              spatial:
                                type: object
                                required:
                                - bbox
                                - crs
                                properties:
                                  bbox:
                                    type: array
                                    items:
                                      type: array
                                      items:
                                        type: number
                                    example:
                                    - - -180.0
                                      - -90.0
                                      - 180.0
                                      - 90.0
                                  crs:
                                    type: string
                                    example: http://www.opengis.net/def/crs/OGC/1.3/CRS84
                              temporal:
                                type: object
                                required:
                                - trs
                                properties:
                                  trs:
                                    type: string
                                    example: http://www.opengis.net/def/uom/ISO-8601/0/Gregorian
                                  interval:
                                    type: array
                                    items:
                                      type: array
                                      items:
                                        type: string
                                        nullable: true
                                    example:
                                    - - 2024-01-01 00:00:00+00:00
                                      - 2025-12-31 23:59:59+00:00
                                  values:
                                    type: array
                                    items:
                                      type: string
                                    example:
                                    - 2024-01-01T00:00:00Z/2025-12-31T23:59:59Z
                          data_queries:
                            type: object
                            properties: {}
                            additionalProperties: false
                          provider:
                            type: object
                            properties:
                              name:
                                type: string
                                example: NOAA/NWS/Meteorological Development Laboratory
                                  (MDL)
                              url:
                                type: string
                                example: https://www.weather.gov/mdl/
                              contact:
                                type: object
                                properties:
                                  email:
                                    type: string
                                    example: nws.mdl.support@noaa.gov
                                  instructions:
                                    type: string
                                    example: Data provided by the National Weather
                                      Service.
                                  country:
                                    type: string
                                    example: USA
                      - type: object
                        required:
                        - id
                        - links
                        - extent
