                                    type: object
                                    properties:
                                      label:
                                        type: string
                                        enum:
                                        - Flood Stage
                                        default: Flood Stage
                                      id:
                                        type: string
                                        enum:
                                        - flood_stage
                                        default: flood_stage
                                    required:
                                    - label
                                  unit:
                                    type: object
                                    properties:
                                      label:
